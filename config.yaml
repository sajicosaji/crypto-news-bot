      lang: ja
      max_age_days: 14
      only_japanese: true
    - name: "ニュース検索（Unifi）"
      url: "https://www.bing.com/news/search?q=Unifi+LINE&format=rss&setlang=ja&cc=JP"
      kind: media
      lang: ja
      max_age_days: 7
      require_keywords: true
    - name: "Kaia公式ブログ"
      url: "https://blog.kaia.io/rss/"
      kind: official
      lang: multi
      max_age_days: 14
    - name: "KAIA DLT Foundation（PR TIMES）"
