# crypto-news-bot 設定ファイル
# 銘柄を追加するときは、ここに銘柄を追加し、.env に WEBHOOK_XXX を追加するだけでよい。

btc_coingecko_id: bitcoin

# BTCは相場全体の指標。急騰・急落したら一言告知する（BTC専用チャンネルは作らず、
# 指定したチャンネルに流す）。あわせてBTCの記事も保存しておき、原因の分析に使う。
btc_market_alert:
  enabled: true
  channel: ETH                 # 告知を流すチャンネル（coins のキー名）
  change_pct_24h: 5            # 24時間でこの%以上動いたら告知
  names:                       # 見出しにこれらが含まれる記事をBTC関連として保存する
    - "Bitcoin"
    - "BTC"
    - "ビットコイン"

# この日数より古い記事・価格・速報履歴は自動で削除する（データベースを小さく保つ）
data_retention_days: 30

# 自走モード（--serve）の時刻設定。すべて日本時間。
# GitHubのスケジュール実行は発火しないことが多いため、1つの長時間ジョブの中で
# 自分の時計を見て日次まとめ・週次振り返り・速報を実行する方式にしている。
schedule:
  alert_interval_minutes: 30   # 速報チェックの間隔
  digest_hour_jst: 7           # 日次まとめの時刻
  # 何らかの理由で朝に実行できなかった場合、この時間内なら遅れて投稿する
  # （例: 7時 + 6時間 = 13時まで。それを過ぎたらその日は見送る）
  digest_window_hours: 6
  weekly_weekday: 0            # 週次振り返りの曜日（0=月曜）

coins:
  ARB:
    coingecko_id: arbitrum
    webhook_env: WEBHOOK_ARB
    username: "ARB News"
    # 見出しに含まれていたら採用する検索語（単語境界で判定。略称単独は誤検出しやすいので避ける）
    names:
      - "Arbitrum"
      - "ARB token"
      - "アービトラム"
  ETH:
    coingecko_id: ethereum
    webhook_env: WEBHOOK_ETH
    username: "ETH News"
    names:
      - "Ethereum"
      - "Ether"
      - "イーサリアム"
  SOL:
    coingecko_id: solana
    webhook_env: WEBHOOK_SOL
    username: "SOL News"
    names:
      - "Solana"
      - "ソラナ"
  WLD:
    # CoinGecko の id は実際に確認済み。"worldcoin" は別の古いトークンを指すため使わないこと。
    coingecko_id: worldcoin-wld
    webhook_env: WEBHOOK_WLD
    username: "WLD News"
    names:
      - "Worldcoin"
      - "World Network"
      - "WLD token"
      - "ワールドコイン"

# ニュース取得元
sources:
  # Google News は datacenter IP（GitHub Actions等）からのアクセスを503で拒否するため、
  # クラウド実行では使えない。代わりに下の直接RSSを厚くしている。
  # ローカルPCで動かす場合だけ true にすると追加の取得元として使える。
  google_news_en: false
  google_news_ja: false
  # 直接RSS。ここに追加すると取得元が増える。
  # Google Newsと違い、本文抜粋が取れてリンクも記事に直接つながるため、
  # 「リンクを踏まずに内容が分かる」のはこちらの媒体。日本語media優先で並べている。
  # （CoinPostとCointelegraph日本版のRSSは配信停止中だったため不採用）
  feeds:
    - name: "CoinDesk Japan"
      url: "https://www.coindeskjapan.com/feed/"
    - name: "あたらしい経済"
      url: "https://www.neweconomy.jp/feed"
    - name: "BeInCrypto Japan"
      url: "https://jp.beincrypto.com/feed/"
    - name: "CoinDesk"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - name: "Cointelegraph"
      url: "https://cointelegraph.com/rss"
    - name: "The Block"
      url: "https://www.theblock.co/rss.xml"
    - name: "Decrypt"
      url: "https://decrypt.co/feed"
    - name: "CryptoSlate"
      url: "https://cryptoslate.com/feed/"
    - name: "Blockworks"
      url: "https://blockworks.co/feed"
    - name: "The Defiant"
      url: "https://thedefiant.io/api/feed"
    - name: "DL News"
      url: "https://www.dlnews.com/arc/outboundfeeds/rss/"
    - name: "Crypto Briefing"
      url: "https://cryptobriefing.com/feed/"
    - name: "BeInCrypto"
      url: "https://beincrypto.com/feed/"
    - name: "Cryptonews"
      url: "https://cryptonews.com/news/feed/"
    - name: "U.Today"
      url: "https://u.today/rss"
    - name: "AMBCrypto"
      url: "https://ambcrypto.com/feed/"
    - name: "CryptoPotato"
      url: "https://cryptopotato.com/feed/"
    - name: "CoinGape"
      url: "https://coingape.com/feed/"
    - name: "NewsBTC"
      url: "https://www.newsbtc.com/feed/"
    - name: "Bitcoinist"
      url: "https://bitcoinist.com/feed/"
    - name: "The Crypto Basic"
      url: "https://thecryptobasic.com/feed/"
    - name: "CoinJournal"
      url: "https://coinjournal.net/feed/"
  # Arbitrum DAO 公式フォーラム（Discourse）。実在を確認済み。
  arbitrum_dao_forum_rss: "https://forum.arbitrum.foundation/latest.rss"

# 同じニュースの言い換え記事をまとめる設定
# （「ARBが10ドルへ」「7,000%成長予測」のように媒体ごとに見出しが変わるため、
#   完全一致だけでは同じ話題が何件も並んでしまう）
dedup:
  merge_similar_headlines: true
  # 見出しの中で手がかりになる語がこの数だけ一致したら同じ話題とみなす。
  # 増やすとまとめる条件が厳しくなり、減らすと別の話題まで誤ってまとまりやすくなる。
  min_shared_terms: 3
  similarity_window_days: 2
  # ここから下は「表示・通知のときだけ」使うゆるめのしきい値。
  # DBの統合(min_shared_terms)を緩めると別のニュースまで飲み込んでしまうため、
  # 記事は分けて持ったまま、同じまとめ／同じ日の通知に似た見出しを並べないようにする。
  # 誤って同一視しても記事自体は残るので、ここは積極的に弾いてよい。
  display_min_shared_terms: 2
  # 似た見出しの速報を、直前のこの時間内に出していたら見送る
  alert_duplicate_window_hours: 24

# 記事の抜粋（リンクを踏まずに中身が分かるようにする）
excerpt:
  enabled: true
  # 1記事あたりの抜粋の最大文字数。長くするとDiscordの表示上限に達しやすくなるので、
  # 詳しく載せる記事の件数(detailed_items)とのバランスで調整する。
  max_length: 300
  # RSSに抜粋が無い媒体（CoinDesk等）は記事ページから og:description を取得する
  fetch_og_description: true
  fetch_timeout_seconds: 8
  # 1回の実行でページ取得する記事数の上限（時間がかかりすぎないようにする）
  max_page_fetches: 12

# 記事の日本語要約（Claude Haiku を使う。ここだけ有料APIを使用）
# APIキーは GitHub Secrets の ANTHROPIC_API_KEY から読む。未設定なら自動的に
# 本文抜粋の表示に戻るので、有効にしたまま放置しても壊れない。
summary:
  enabled: true
  # 要約は「英語を日本語に正確に直す」作業で、一番回数が多い処理。ここは安いHaikuで十分。
  # 品質を上げたければ "claude-sonnet-5"（費用は約2倍、月+200円程度）。
  model: "claude-haiku-4-5"
  max_output_tokens: 500
  fetch_timeout_seconds: 10
  # 1回の実行で要約する最大件数（費用の上限）。要約は1記事1回だけで、
  # 結果はDBに保存して使い回すため、実際の課金は新着記事の分だけ。
  max_articles_per_run: 15

# LLMの単価（USD / 100万トークン）。実行ごとの費用の目安をログに出すために使う。
# 正確な請求額は https://console.anthropic.com の Usage で確認する。
llm_pricing:
  claude-haiku-4-5:  {input: 1.0, output: 5.0}
  claude-sonnet-5:   {input: 2.0, output: 10.0}
  claude-opus-5:     {input: 5.0, output: 25.0}
  claude-opus-5-5:   {input: 4.0, output: 20.0}
  usd_jpy: 150

# 値動きの背景になりそうなニュースの表示
# BTCと一緒に動いただけの場合は個別ニュースのせいにせず、その旨だけ表示する。
move_context:
  enabled: true
  # BTCの24h変化率との差がこの%以上なら「銘柄固有の動き」とみなし、背景ニュースを探す。
  # 小さくすると些細な差でもニュースを結びつけてしまい、大きくすると拾えなくなる。
  # BTC自体は「相場全体の動きかどうか」を見分ける指標として使い続ける。
  coin_specific_pct: 3
  max_items: 3
  # 銘柄固有の動きが出たときは、直近の記事をまとめてHaikuに渡し「何が起きたか」を
  # 必ず分析させる（キーワードでは拾えない原因も読み取る）。原因が見当たらない場合も
  # その旨を明記する。銘柄固有の動きのときだけ動くので費用はごく小さい。
  llm_analysis: true
  analysis_max_articles: 15
  # 原因分析は「複数の記事から因果を判断し、無いときは無いと言う」高度な判断なので、
  # 最上位のOpusを使う。銘柄固有の動きのときだけ動くため、回数が少なく費用は月数百円。
  # Opus 5.5 は Opus 5 より高性能で2割安い（$4/$20 vs $5/$25、2026-09-26 公式料金表で確認）。
  # 実測でも、媒体間で数字が食い違う点（ETF流入額など）を指摘できるようになった。
  analysis_model: "claude-opus-5-5"

# 投稿する価値があるかをLLMに判定させる（キーワードでは言い換えを追い切れないため）
# 「読んでも行動が変わらない記事」を落とす。除外された記事はDBに残るが表示しない。
relevance_filter:
  enabled: true
  model: "claude-haiku-4-5"   # 判定は短いのでHaikuで十分（1件あたり約0.1円）
  # 落とす対象の目安。プロンプトに渡すのでそのまま文章で書いてよい。
  drop_reasons:
    - "価格予測・目標株価だけの記事（誰かが『いくらになる』と言っただけのもの）"
    - "テクニカル分析・チャート解説だけの記事"
    - "保有者の判断に関係しないDAO内部の手続き・助成金の配分・フォーラムの雑談"
    - "具体的な事実が無く、憶測や一般論だけの記事"
    - "他銘柄が主題で、この銘柄には影響しない記事（ただし下の『必ず残す』に当たるものは除く）"
  # 銘柄ごとに「これに触れている記事は必ず残す」語。誤って落とすのを防ぐ。
  # 銘柄名そのもの（Arbitrum等）は入れないこと。全記事が素通りしてしまう。
  # 「銘柄名が出ていなくても重要」な固有名詞だけを入れる。
  always_keep_keywords:
    ARB:
      - "Robinhood Chain"   # ARBの収益源。見出しにARBが無くても重要
      - "Orbit"             # Arbitrum Orbit チェーン
    WLD:
      - "Morpho"            # WLD担保のDeFiリスク
      - "World ID"

# 「このリンクは読む価値がある」というアドバイス（キーワードとルールで判定）
reading_advice:
  enabled: true
  # この%以上の値動きが同時に起きていれば優先度を上げる
  price_reaction_pct: 5
  # 「読む価値」がこの優先度以上の記事だけを、速報で通知し、日本語要約と解析を付ける。
  # 低い記事は日次まとめに見出し1行だけ載せる（通知も要約もしない＝費用も増えない）。
  # "高" にすると本当に重要なものだけ、"低" にすると全部が対象になる。
  minimum_priority: "中"

# 見出しにこれらの語が含まれる記事は除外する
exclude_keywords:
  - "price prediction"
  - "price analysis"
  - "price forecast"
  - "could reach"
  - "could hit"
  - "price target"
  - "predicts"
  - "forecasts"
  - "to hit $"
  - "rally to $"
  - "surge to $"
  - "by 2030"
  - "by 2027"
  - "x growth"
  - "% growth by"
  - "予想"
  - "予測"
  - "テクニカル分析"
  - "見通し"

# 見出しの判定に使うキーワード（差し替え自由）
keywords:
  good:
    en:
      - surge
      - rally
      - soar
      - record
      - partnership
      - integration
      - launch
      - upgrade
      - approval
      - inflow
      - buyback
      - burn
    ja:
      - 上昇
      - 急騰
      - 提携
      - 承認
      - 買い戻し
      - バーン
  bad:
    en:
      - plunge
      - drop
      - slump
      - hack
      - exploit
      - unlock
      - lawsuit
      - outage
      - delist
      - outflow
      - ban
      - suspend
      - depeg
    ja:
      - 下落
      - 急落
      - ハッキング
      - 流出
      - アンロック
      - 停止
      - 禁止

# ヒットしたら速報の候補になる重大ワード（全銘柄共通）
critical_keywords:
  en:
    - hack
    - exploit
    - drained
    - breach
    - delist
    - SEC
    - lawsuit
    - halt
    - outage
    - depeg
    - bankruptcy
    - "ETF approval"
    - "ETF rejected"
    - "listing on Coinbase"
    - "listing on Binance"
    - "listing on Upbit"
  ja:
    - ハッキング
    - 流出
    - 上場廃止
    - 停止

# 既知の誤判定を招く言い回し。スコアリング前に見出しから取り除く（「falls short」など）
idiom_neutralizers:
  - "falls short"
  - "no hack"
  - "no exploit"

# 英語の否定語。キーワード直前の数語にあれば、そのキーワードは判定から除外する
negation_words_en:
  - "no"
  - "not"
  - "denies"
  - "denied"
  - "without"
  - "avoids"
  - "avoided"
  - "isn't"
  - "wasn't"
  - "doesn't"
  - "didn't"

# 日本語の否定の接尾表現。キーワード直後にあれば、そのキーワードは判定から除外する
# （例: 「アンロック後も下落せず」の「下落」を否定として扱う）
negation_suffixes_ja:
  - "せず"
  - "しない"
  - "回避"
  - "否定"

emojis:
  good: "🚀"
  bad: "📉"
  neutral: "📰"
  alert: "🚨"

# 速報に付けるメンション。全員に通知が飛んで迷惑になるため既定はメンションなし。
# 通知が欲しくなったら "@here" / "@everyone" / "<@&ロールID>" に変更する
# （特定の人だけに通知するならロールIDが安全）。
mention: ""

# 速報の条件（銘柄ごとに変更可能）
alert_thresholds:
  arb_wld_price_change_pct: 10        # ARB・WLD: 24時間でこの%以上動いたら速報
  eth_sol_price_change_pct: 8         # ETH・SOL: 24時間でこの%以上動いたら速報
  eth_sol_critical_media_count: 2     # ETH・SOL: 重大ワード記事が直近window時間内でこの媒体数以上
  eth_sol_critical_window_hours: 3
  price_alert_cooldown_hours: 12      # 価格急変・節目の速報のクールダウン（同一銘柄・同一条件）
  max_alerts_per_channel_per_run: 3   # 1回の実行での速報上限（チャンネルごと）
  # 重大ワードが無くても、これだけの媒体が同じニュースを報じていたら
  # 「注目ニュース」として全銘柄で個別に速報する。
  # （「Standard CharteredがARBの目標を引き上げ」のように、重大ワードには当たらないが
  #   多くの媒体が追いかける＝価値のある話題を、朝のまとめまで待たずに届けるため）
  # 通知が多すぎると感じたら数を増やす。少ないと感じたら2に下げる。
  notable_media_count: 3
  # 公開からこの時間を超えた記事は速報にしない
  # （Google Newsの検索結果には数ヶ月前の記事も混ざるため、今はじめてDBに保存された
  #   古い記事を「速報」として誤って流さないためのガード。30分間隔の実行を想定し、
  #   実行漏れも考慮して余裕を持たせている）
  news_alert_max_age_hours: 6

# DAOの投票（Snapshot）の監視。APIキー不要・無料。
# Arbitrumは Snapshot で先に投票してからオンチェーンに進むため、ここが一番早い。
# （Tally は APIキーが必須で401になるため使わない。実際に確認済み）
governance:
  enabled: true
  api_url: "https://hub.snapshot.org/graphql"
  # 監視するスペースと、通知先のチャンネル
  spaces:
    - space: "arbitrumfoundation.eth"   # Arbitrum DAO（提案419件・フォロワー32万）
      coin: ARB
  # 投票のタイトルにこれらの語が含まれるものだけ通知する。
  # 役員選挙や細かい助成金まで拾うとうるさいので絞る。
  topic_keywords:
    - buyback
    - "buy back"
    - burn
    - treasury
    - "fee switch"
    - tokenomics
    - staking
    - unlock
    - "value accrual"
    - revenue
    - "Timeboost"
    - sequencer
  # どの段階で通知するか
  notify_on_start: true        # 投票が始まったとき
  notify_before_end: true      # 締切が近いとき
  hours_before_end: 24         # 締切の何時間前に知らせるか
  notify_on_close: true        # 可決・否決が決まったとき
  # 終了からこの時間を超えた投票は通知しない。
  # これが無いと、初回実行や引き継ぎ失敗時に過去の結果を一斉に投稿してしまう。
  max_age_hours_for_closed: 48

# ARB 固有設定
arb:
  extra_search_terms:
    - "Robinhood Chain"
    - "Arbitrum sequencer"
    - "Arbitrum DAO"
    - "Arbitrum treasury"
  # DAOフォーラムの新規投稿タイトルにこれらの語を含めば記事として扱う（[DAO提案] として良い材料）
  # フォーラムの雑談まで拾わないよう、提案のタイトルに付く語に絞る
  # （Arbitrum DAOの提案は [AIP]/Proposal/RFC などが頭に付く慣習）
  dao_forum_keywords:
    - "AIP"
    - "Proposal"
    - "RFC"
    - "Snapshot"
  # さらに、この語のどれかも含む投稿だけを対象にする（本当に効く提案だけ拾う）
  dao_forum_topic_keywords:
    - buyback
    - burn
    - treasury
    - "fee switch"
    - tokenomics
    - staking
    - unlock
  price_levels: [0.14, 0.20]
  # 円建ての節目。上抜けしたら全力でお祝いする速報を出す（本人の希望で利確ラインを公開）。
  # message は Discord にそのまま出る。好きな文言に書き換えてよい。
  # mention を書けばこの祝福だけ通知を飛ばせる（普段の速報はメンションなし）。
  celebration_levels_jpy:
    - price: 45
      title: "🎉🎉🎉 ARB 45円突破！！ 🎉🎉🎉"
      message: |
        **利確ライン到達。原資分は全額回収。**
        ここまで握り続けた自分を褒めていい。
        おめでとう🍾
      mention: ""
  # DefiLlama のスラッグ／チェーン名（実際に確認済み）
  defillama:
    robinhood_chain_fees_chain: "Robinhood Chain"
    arbitrum_fees_chain: "Arbitrum"
    dao_treasury_slug: "arbitrum-dao"
  onchain_weekly_change_alert_pct: 30
  # 見出しに含まれていれば速報候補にする良い材料（DAOのbuyback/burn等の話題）
  priority_good_keywords:
    - buyback
    - burn
    - "fee switch"
    - treasury
    - "value accrual"
    - staking
  # 見出しに含まれていれば速報候補にする悪い材料（アンロック・sequencer障害・ブリッジ問題など）
  priority_bad_keywords:
    - unlock
    - sequencer
    - bridge
  # アンロック予定はここに手入力する（日付をコードに直書きしない）
  unlocks: []
  # 例:
  # unlocks:
  #   - date: "2026-10-16"
  #     amount: "92,600,000 ARB"
  #     description: "投資家・チーム向け月次アンロック"

# ETH 固有設定（速報は価格急変のみ。ETH固有の重点監視語は無し）
eth:
  extra_search_terms: []

# SOL 固有設定
sol:
  # 単独では紛らわしい語（Jupiterは衛星企業や地名とも一致するため）は
  # crypto文脈が伝わる複合語にしている
  extra_search_terms:
    - "Raydium"
    - "Orca DEX"
    - "Meteora Solana"
    - "Jupiter Exchange crypto"
    - "USD1 stablecoin"
    - "World Liberty Financial"
  usd1_coingecko_id: usd1-wlfi
  usd1_depeg_low: 0.995
  usd1_depeg_high: 1.005
  hourly_change_alert_pct: 5
  # Solanaの主要DEX名。見出しにこれと重大ワードが両方含まれれば速報候補にする
  dex_names:
    - Raydium
    - Orca
    - Meteora
    - Jupiter

# WLD 固有設定
wld:
  # "World App" は単独だと Disney World のアプリ等と紛らわしいため使わない
  extra_search_terms:
    - "Morpho WLD"
    - "World ID crypto"
  price_levels: [0.5, 0.75, 1.0]
  unlocks: []
  # 各国の規制・停止命令・プライバシー調査系。見出しに含まれていれば速報候補（悪材料）にする
  priority_bad_keywords:
    - ban
    - suspend
    - regulator
    - privacy
    - investigation
    - 停止命令
    - 規制当局
  morpho:
    enabled: true
    collateral_symbol: "WLD"
    min_supply_usd: 10000   # このドル規模未満のマーケットはノイズとして無視
    utilization_alert_pct: 95
    # 「Morpho」と併記されていれば速報候補にするリスクワード
    risk_keywords:
      - "bad debt"
      - oracle
      - liquidation
      - paused
  # World Network の認証済み人数などの公開APIは確認できなかったため無効化（README参照）
  world_network_stats_enabled: false

# マクロ経済イベント（日付を手入力）
macro_events: []
# 例:
# macro_events:
#   - date: "2026-10-29"
#     description: "FOMC（政策金利発表）"
#   - date: "2026-10-15"
#     description: "米CPI発表"

digest:
  max_news_items: 10
  # その日のニュースが1件も無い銘柄は、日次まとめ自体を投稿しない（空投稿を減らす）
  skip_when_no_news: true
  # ニュースが無くても必ず毎日投稿する銘柄。空にすれば全銘柄がニュースのある日だけになる
  always_post: []
  # 銘柄ごとに「この優先度以上の記事が無ければ投稿しない」を指定できる。
  # ETH・SOLは低い記事ばかりの日が多いため、中以上が1件も無ければ見送る。
  # 書いていない銘柄（ARB・WLD）は、記事が1件でもあれば投稿する。
  minimum_priority_to_post:
    ETH: "中"
    SOL: "中"
  # 上位何件を「抜粋＋読む価値アドバイス付き」で詳しく載せるか。
  # 残りは1行のリスト表示になる（Discordの文字数上限を超えないための配分）。
  detailed_items: 5

weekly:
  top_move_days: 3
  onchain_weeks: 4

discord:
  post_interval_seconds: 1.2
