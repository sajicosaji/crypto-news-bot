name: crypto-news-bot

# PCの電源に関係なくGitHub上で実行する。
#
# GitHubのスケジュール実行(schedule)はこのアカウントでは発火しないことが多いため、
# 「1つの長時間ジョブが自分の時計を見て各モードを実行する」自走モード(serve)が本体。
# 外部トリガー（Claudeのクラウドルーティン）が1日4回このジョブを起動する。
# 下のscheduleは保険として残してある（発火すればその分も動く）。
on:
  schedule:
    - cron: "5 22,4,10,16 * * *"   # 保険。外部トリガーが本体
  workflow_dispatch:
    inputs:
      mode:
        description: "実行するモード"
        required: true
        default: serve
        type: choice
        options: [serve, alert, digest, weekly, test-webhooks]
      max_runtime:
        description: "自走モードの最大実行時間（分）"
        required: false
        default: "330"
      dry_run:
        description: "投稿せず内容だけログに出す（動作確認用）"
        required: false
        default: false
        type: boolean

# 同時に走るとデータベースの引き継ぎが壊れるため、必ず1つずつ実行する。
# 新しいジョブが来たら古いジョブを止めて引き継ぐ（長時間ジョブが居座らないように）。
concurrency:
  group: crypto-news-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      # 前回の実行結果（記事履歴・価格・速報履歴）を引き継ぐ。
      # 引き継げなかった場合も初回扱いで安全に動く（速報は出さず保存のみ）。
      - name: データベースの復元
        uses: actions/cache/restore@v4
        with:
          path: data/bot.db
          key: botdb-${{ github.run_id }}
          restore-keys: |
            botdb-

      - name: 実行するモードを決める
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "runtime=${{ inputs.max_runtime }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
            else
              echo "dry=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=serve" >> "$GITHUB_OUTPUT"
            echo "runtime=330" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: 実行
        env:
          WEBHOOK_ARB: ${{ secrets.WEBHOOK_ARB }}
          WEBHOOK_ETH: ${{ secrets.WEBHOOK_ETH }}
          WEBHOOK_SOL: ${{ secrets.WEBHOOK_SOL }}
          WEBHOOK_WLD: ${{ secrets.WEBHOOK_WLD }}
          # 日本語要約に使う。未設定でも動く（抜粋表示に自動で戻る）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "serve" ]; then
            python main.py --serve --max-runtime "${{ steps.mode.outputs.runtime }}" ${{ steps.mode.outputs.dry }}
          else
            python main.py --${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.dry }}
          fi

      # ジョブが途中で止められた場合もデータを残す
      - name: データベースの保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bot.db
          key: botdb-${{ github.run_id }}

      - name: ログの保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
