name: kaia-test

# Kaia・JPYCの発信案を手動で動かす（試し用）。
# 本番（毎朝7時のまとめ・3時間おきのWeb更新）は crypto-news-bot の自走ジョブの中で動く。
# こちらは本番のデータベースに触らない（使った話題の記録も残さない）。
# web をオンにしたときだけWebページのデータを書き換える。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "digest=まとめを作る / refresh=ニュース一覧だけ更新"
        required: true
        default: digest
        type: choice
        options: [digest, refresh]
      theme:
        description: "まとめの代わりにX用1本を試す枠（auto=まとめ）"
        required: true
        default: auto
        type: choice
        options: [auto, news, recap, howto, data, ecosystem, tech, japan, basics]
      web:
        description: "Webページのデータを書き換える"
        required: false
        default: false
        type: boolean
      post:
        description: "Discordに届ける（WEBHOOK_KAIA があるときだけ）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: kaia-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: 発信案を作る
        env:
          WEBHOOK_KAIA: ${{ secrets.WEBHOOK_KAIA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          # Webを書き換えないときはトークンを渡さない（データは data/kaia_site_preview.json に保存される）
          if [ "${{ inputs.web }}" != "true" ]; then unset GITHUB_TOKEN; fi
          if [ "${{ inputs.post }}" != "true" ]; then unset WEBHOOK_KAIA; fi
          # 本番のDBは使わず、毎回まっさらなDBで動かす
          rm -f data/bot.db
          if [ "${{ inputs.mode }}" = "refresh" ]; then
            python main.py --kaia-refresh
          else
            THEME=""
            if [ "${{ inputs.theme }}" != "auto" ]; then THEME="--kaia-theme ${{ inputs.theme }}"; fi
            python main.py --kaia $THEME
          fi

      - name: 作ったデータを保存（確認用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaia-preview-${{ github.run_id }}
          path: data/kaia_site_preview.json
          retention-days: 7
          if-no-files-found: ignore
