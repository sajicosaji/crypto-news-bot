<style>
:root {
  --bg: #f3f5f1; --surface: #ffffff; --surface-2: #ecefe8; --ink: #141a15; --ink-2: #48514a; --ink-3: #78827a; --line: #dce1d8;
  --accent: #06c755; --accent-ink: #ffffff; --accent-strong: #058a3c; --accent-soft: #dcf6e6;
  --unifi: #058a3c; --unifi-bg: #dcf6e6; --kaia: #5b7a00; --kaia-bg: #eef8c9; --jpyc: #1d5fd1; --jpyc-bg: #e1ebff;
  --both: #0b7a6c; --both-bg: #d8f3ee; --stable: #8a5a00; --stable-bg: #f8ecd2; --money: #6a4bb5; --money-bg: #ece6fb;
  --up: #0f8a4b; --down: #c0392b; --warn: #a64b00; --warn-bg: #fff1e0; --bad: #b3261e; --bad-bg: #fde8e6; --good: #2f7d32;
  --c-eth: #6b7cff; --c-pol: #8247e5; --c-ava: #e84142; --c-kaia: #9ac30a;
  --shadow: 0 1px 2px rgba(20, 26, 21, .06), 0 4px 16px rgba(20, 26, 21, .05);
  --radius: 14px; --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d110e; --surface: #161c18; --surface-2: #1e2620; --ink: #ecf2ed; --ink-2: #b6c0b8; --ink-3: #829085; --line: #2a332c;
    --accent: #2fd273; --accent-ink: #06210f; --accent-strong: #5fe39a; --accent-soft: #12301f;
    --unifi: #5fe39a; --unifi-bg: #12301f; --kaia: #c9f53a; --kaia-bg: #26300f; --jpyc: #8fb4ff; --jpyc-bg: #17233d;
    --both: #63d6c4; --both-bg: #11302b; --stable: #f0c06a; --stable-bg: #33270f; --money: #c4b0ff; --money-bg: #261d3d;
    --up: #4fd18b; --down: #ff7b6e; --warn: #ffb86b; --warn-bg: #36240f; --bad: #ff8a80; --bad-bg: #3a1714; --good: #81c784;
    --c-eth: #8f9cff; --c-pol: #a77bff; --c-ava: #ff6b6b; --c-kaia: #c9f53a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d110e; --surface: #161c18; --surface-2: #1e2620; --ink: #ecf2ed; --ink-2: #b6c0b8; --ink-3: #829085; --line: #2a332c;
  --accent: #2fd273; --accent-ink: #06210f; --accent-strong: #5fe39a; --accent-soft: #12301f;
  --unifi: #5fe39a; --unifi-bg: #12301f; --kaia: #c9f53a; --kaia-bg: #26300f; --jpyc: #8fb4ff; --jpyc-bg: #17233d;
  --both: #63d6c4; --both-bg: #11302b; --stable: #f0c06a; --stable-bg: #33270f; --money: #c4b0ff; --money-bg: #261d3d;
  --up: #4fd18b; --down: #ff7b6e; --warn: #ffb86b; --warn-bg: #36240f; --bad: #ff8a80; --bad-bg: #3a1714; --good: #81c784;
  --c-eth: #8f9cff; --c-pol: #a77bff; --c-ava: #ff6b6b; --c-kaia: #c9f53a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--ink); padding-bottom: env(safe-area-inset-bottom);
  font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }

header.top { padding: 16px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: #15201a; display: grid; place-items: center; flex: none; }
.mark svg { width: 26px; height: 26px; }
.brand h1 { font-size: 18px; line-height: 1.25; margin: 0; letter-spacing: .01em; }
.brand .sub { font-size: 12px; color: var(--ink-3); }
.live { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--ink-3); line-height: 1.45; white-space: nowrap; }
.live .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 5px; vertical-align: 1px; }
.live.on .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(6, 199, 85, .6); animation: pulse 2s infinite; }
.live.on .state { color: var(--accent-strong); font-weight: 700; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(6, 199, 85, .55); } 70% { box-shadow: 0 0 0 7px rgba(6, 199, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0); } }

nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 11px 11px 10px; font-size: 14px; color: var(--ink-3); cursor: pointer; border-bottom: 2.5px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent-strong); }

main { padding: 16px 0 48px; }
section[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15.5px; margin: 0 0 8px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.sec-title { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 800; color: var(--ink); margin: 22px 2px 10px; }
.sec-title .more { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent-strong); background: none; border: 0; cursor: pointer; padding: 0; }
.howto { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 600; text-decoration: none; min-height: 36px; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--surface-2); color: var(--ink-2); }
.empty { text-align: center; padding: 26px 16px; color: var(--ink-3); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 10px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin-bottom: 10px; }
.search:focus { outline: none; border-color: var(--accent-strong); }

/* 今日の動き */
.today { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; }
.today .when { font-size: 12.5px; color: var(--ink-3); }
.today .text { font-size: 15.5px; font-weight: 700; line-height: 1.65; margin-top: 2px; }
.up { color: var(--up); } .down { color: var(--down); }

/* タイル */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; min-height: 168px; }
.tile .head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.tile .badge { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; }
.badge.unifi { background: var(--unifi-bg); color: var(--unifi); }
.badge.jpyc { background: var(--jpyc-bg); color: var(--jpyc); }
.badge.kaia { background: var(--kaia-bg); color: var(--kaia); }
.tile .value { font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.tile .value small { font-size: 14px; font-weight: 700; margin-left: 3px; color: var(--ink-2); }
.tile .sub { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile .foot { margin-top: auto; padding-top: 8px; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }
.tile .foot .ok::before { content: "● "; color: var(--accent); }
.tile .foot .ng::before { content: "● "; color: var(--warn); }
.spark { width: 100%; height: 44px; margin-top: 8px; display: block; }
.bars { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin-top: 10px; background: var(--surface-2); }
.bars span { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin-top: 6px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-weight: 600; }

/* リスト */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.li { display: block; padding: 11px 14px; border-bottom: 1px solid var(--line); text-decoration: none; }
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 700; line-height: 1.5; }
.li a.t { text-decoration: none; }
.li a.t:hover { text-decoration: underline; }
.li .orig { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.topic { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
.topic.unifi { background: var(--unifi-bg); color: var(--unifi); }
.topic.kaia { background: var(--kaia-bg); color: var(--kaia); }
.topic.jpyc { background: var(--jpyc-bg); color: var(--jpyc); }
.topic.both { background: var(--both-bg); color: var(--both); }
.topic.stablecoin, .topic.money, .topic.common { background: var(--stable-bg); color: var(--stable); }
.flag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 6px; }
.flag.new { background: var(--accent); color: var(--accent-ink); }
.flag.bad { background: var(--bad-bg); color: var(--bad); }
.flag.warn { background: var(--warn-bg); color: var(--warn); }
.flag.official { background: var(--surface-2); color: var(--ink-2); }
.day { font-size: 12.5px; font-weight: 800; color: var(--ink-3); margin: 18px 2px 8px; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rel button { border: 1px dashed var(--accent-strong); background: transparent; color: var(--accent-strong); border-radius: 999px; padding: 1px 10px; font-size: 12px; cursor: pointer; }
details.others { margin-top: 4px; font-size: 12.5px; }
details.others summary { cursor: pointer; color: var(--ink-3); }
details.others a { display: block; color: var(--ink-2); padding: 2px 0; }
.ev { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.ev:last-child { border-bottom: 0; }
.ev .d { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 700; font-size: 13px; }
.ev .left { font-size: 12px; font-weight: 800; color: var(--accent-strong); white-space: nowrap; }
.ev.past .left { color: var(--ink-3); font-weight: 600; }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* チャート */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
.chart-card h2 { display: flex; align-items: baseline; gap: 8px; }
.chart-card h2 .now { margin-left: auto; font-size: 18px; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: 150px; display: block; }
.chart .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 4px; }
.chart .range { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tbl th, table.tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
table.tbl th { font-size: 12px; color: var(--ink-3); font-weight: 700; }
.tbl-wrap { overflow-x: auto; }

/* 解説 */
.audience { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.aud { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; text-align: left; cursor: pointer; line-height: 1.35; }
.aud .n { display: block; font-weight: 800; font-size: 14px; }
.aud .d { display: block; font-size: 11.5px; color: var(--ink-3); }
.aud[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--accent-soft); }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; transition: box-shadow .3s, border-color .3s; }
.qa.flash { border-color: var(--accent-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
.qa .cat { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.qa .q { font-size: 16px; font-weight: 800; line-height: 1.5; margin: 2px 0 8px; }
.qa .one { background: var(--accent-soft); border-left: 4px solid var(--accent-strong); border-radius: 6px 10px 10px 6px; padding: 8px 12px; font-weight: 700; }
.qa .body { white-space: pre-line; margin-top: 10px; }
.qa .body.pro { font-size: 14px; color: var(--ink-2); }
.qa details.more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.qa details.more summary { cursor: pointer; font-size: 13px; color: var(--ink-3); }
.qa .caution { margin-top: 10px; background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; }
.qa .srcs { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.qa .srcs a { display: block; color: var(--ink-3); padding: 1px 0; text-decoration: none; }
.qa .srcs a:hover { text-decoration: underline; }
.daily-card .k { font-size: 12px; font-weight: 800; color: var(--accent-strong); letter-spacing: .04em; }
.daily-card .q { font-size: 16px; font-weight: 800; margin: 2px 0 4px; line-height: 1.5; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; }
.term .n { font-weight: 800; }
.term .d { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.term .p { color: var(--ink-3); font-size: 13px; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }

/* Unifiのリワード率 */
.rate-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.rate-cell { background: var(--unifi-bg); border-radius: 10px; padding: 8px 6px; text-align: center; }
.rate-cell .nm { display: block; font-size: 11.5px; font-weight: 800; color: var(--unifi); }
.rate-cell b { display: block; font-size: 22px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.rate-cell .ds { display: block; font-size: 11px; color: var(--ink-3); }
.rate-change { margin-top: 8px; font-size: 13px; border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 3px; }
.rate-change .k { font-size: 11.5px; font-weight: 800; color: var(--ink-3); margin-right: 6px; }
.rate-change .flag { margin-right: 6px; }
.rate-change .more { justify-self: start; margin-left: 0; font-size: 12.5px; font-weight: 700; color: var(--accent-strong); background: none; border: 0; padding: 0; cursor: pointer; }

/* ニュースを追いやすく */
.tab-n { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; line-height: 17px; text-align: center; vertical-align: 1px; }
.tab-n[hidden] { display: none; }
.sec-n { font-size: 12px; font-weight: 800; color: var(--accent-strong); }
.li .excerpt { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.flag.major { background: var(--jpyc-bg); color: var(--jpyc); }
.seen-line { display: flex; align-items: center; gap: 10px; margin: 22px 2px 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.seen-line::before, .seen-line::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
details.intro-fold { padding: 12px 16px; }
details.intro-fold > summary { cursor: pointer; font-weight: 800; }
details.intro-fold .intro { box-shadow: none; border: 0; padding: 8px 0 0; margin: 0; }
details.intro-fold .intro h2 { display: none; }

/* はじめての人向け */
.tiles.mini { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tiles.mini .tile { min-height: 0; padding: 12px; cursor: pointer; }
.tiles.mini .tile .value { font-size: 24px; }
.tiles.mini .tile .value small { display: block; margin-left: 0; font-size: 13px; }
.tiles.mini .tile .sub { font-size: 12px; }
.tiles.mini .legend { grid-template-columns: 1fr; font-size: 11.5px; }
.tiles.mini .spark { height: 38px; }
@media (min-width: 700px) { .tiles.mini .tile .value { font-size: 28px; } .tiles.mini .legend { grid-template-columns: 1fr 1fr; } }
.intro .intro-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.intro .intro-row:last-of-type { border-bottom: 0; }
.intro .ic { font-size: 22px; line-height: 1.3; }
.unifi-card .head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.unifi-card .value { font-size: 32px; font-weight: 800; line-height: 1.25; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.unifi-card .value small { font-size: 14px; color: var(--ink-2); margin-left: 4px; }
.unifi-card .sub { font-size: 13px; color: var(--ink-2); }
.unifi-card .foot { margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
.unifi-card .foot .ok::before { content: "● "; color: var(--accent); }
.unifi-card .foot .ng::before { content: "● "; color: var(--warn); }
.calc { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
.calc label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.calc-in { width: 8.5em; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.calc-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; text-align: center; }
.calc-out div { background: var(--surface); border-radius: 8px; padding: 6px 4px; }
.calc-out span { display: block; font-size: 11.5px; color: var(--ink-3); }

          el("td", { text: rate(d.unifi_jpyc) }), el("td", { text: rate(d.unifi_usdt) }), el("td", { text: rate(d.unifi_usdt_plus) })]);
      })))])
    ] : [el("div", { class: "empty", text: "記録は今日から始まります" })]));
  }

  // ---------- 📚 解説 ----------
  var audience = store("kaia.audience") === "pro" ? "pro" : "easy";
  function audienceSwitch(rerender) {
    return el("div", { class: "audience", role: "group", "aria-label": "読み方の切り替え" }, [["easy", "🔰 やさしく", "たとえ話・ふつうの言葉で"], ["pro", "⚡ くわしく", "数字・日付・出典で"]].map(function (a) {
      return el("button", { class: "aud", type: "button", "aria-pressed": String(audience === a[0]), onclick: function () { if (audience === a[0]) return; audience = a[0]; store("kaia.audience", audience); renderLearn(); renderWords(); } }, [el("span", { class: "n", text: a[1] }), el("span", { class: "d", text: a[2] })]);
    }));
  }
  var learnState = { cat: "all", query: "" };
  function qaCard(c) {
    var catLabel = "";
    (KB.categories || []).forEach(function (x) { if (x.id === c.cat) catLabel = x.label; });
    var main = audience === "pro" && c.pro ? el("div", { class: "body pro", text: c.pro }) : el("div", { class: "body", text: c.easy });
    var other = audience === "pro"
      ? el("details", { class: "more" }, [el("summary", { text: "🔰 やさしい説明を見る" }), el("div", { class: "body", text: c.easy })])
      : (c.pro ? el("details", { class: "more" }, [el("summary", { text: "⚡ くわしく（数字・日付）" }), el("div", { class: "body pro", text: c.pro })]) : null);
    return el("article", { class: "qa", id: "card-" + c.id }, [
      el("div", { class: "cat", text: catLabel }), el("div", { class: "q", text: "Q. " + c.q }), el("div", { class: "one", text: c.one }), main, other,
      c.caution ? el("div", { class: "caution", text: "⚠️ " + c.caution }) : null,
      (c.src || []).length ? el("div", { class: "srcs" }, ["出典"].concat(c.src.map(function (s) { return el("a", { href: s.u, target: "_blank", rel: "noopener", text: "🔗 " + s.t + (s.d ? "（" + ymd(s.d) + "）" : "") }); }))) : null
    ]);
  }
  function renderLearn() {
    var root = document.getElementById("learn");
    root.innerHTML = "";
    if (!KB) return;
    root.appendChild(audienceSwitch());
    var input = el("input", { class: "search", type: "search", placeholder: "🔍 さがす（例：利息、送金、税金、パスワード）", "aria-label": "解説をさがす" });
    input.value = learnState.query;
    var chips = el("div", { class: "chips" }), list = el("div");
    var cats = [{ id: "all", label: "すべて" }].concat((KB.categories || []).filter(function (c) { return c.id !== "talk"; }));
    function draw() {
      fill(chips, cats.map(function (c) { return el("button", { class: "chip", type: "button", "aria-pressed": String(learnState.cat === c.id), onclick: function () { learnState.cat = c.id; draw(); } }, [c.label]); }));
      var q = norm(learnState.query).trim();
      var shown = visibleCards().filter(function (c) {
        if (learnState.cat !== "all" && c.cat !== learnState.cat) return false;
        if (!q) return true;
        var hay = norm([c.q, c.one, c.easy, c.pro, (c.ask || []).join(" ")].join(" "));
        return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
      });
      fill(list, shown.length ? shown.map(qaCard) : [el("div", { class: "card empty", text: "見つかりませんでした" })]);
    }
    input.addEventListener("input", function () { learnState.query = input.value; draw(); });
    root.appendChild(input); root.appendChild(chips); root.appendChild(list); draw();
    (KB.links || []).forEach(function (g) {
      root.appendChild(el("div", { class: "card", style: "margin-top:14px" }, [el("h2", { text: "🔗 公式の入口：" + g.group })].concat(g.items.map(function (x) {
        return el("div", { class: "src-row" }, [el("span", { text: "↗" }), el("a", { href: x.u, target: "_blank", rel: "noopener", text: x.t }), el("span", { class: "w", text: host(x.u) })]);
      }))));
    });
  }
  function openCard(id) {
    learnState.cat = "all"; learnState.query = "";
    renderLearn(); show("learn");
    var node = document.getElementById("card-" + id);
    if (node) { node.scrollIntoView({ block: "start" }); node.classList.add("flash"); setTimeout(function () { node.classList.remove("flash"); }, 1800); }
  }
  function cardOfTheDay() {
    var cards = visibleCards();
    if (!cards.length) return null;
    var p = jstParts(new Date());
    return cards[Math.floor(Date.UTC(p.y, p.m - 1, p.d) / 86400000) % cards.length];
  }

  // ---------- 📖 用語 ----------
  var wordState = { cat: "all", query: "" };
  function renderWords() {
    var root = document.getElementById("words");
    root.innerHTML = "";
    if (!KB) return;
    root.appendChild(audienceSwitch());
    var input = el("input", { class: "search", type: "search", placeholder: "🔍 言葉をさがす", "aria-label": "用語をさがす" });
    input.value = wordState.query;
    var chips = el("div", { class: "chips" }), list = el("div");
    var cats = [["all", "すべて"], ["unifi", "📱 Unifi・LINE"], ["jpyc", "💴 JPYC"], ["kaia", "🟢 Kaia"], ["basic", "🔤 基本"], ["law", "🏛 制度"]];
    function draw() {
      fill(chips, cats.map(function (c) { return el("button", { class: "chip", type: "button", "aria-pressed": String(wordState.cat === c[0]), onclick: function () { wordState.cat = c[0]; draw(); } }, [c[1]]); }));
      var q = norm(wordState.query).trim();
      var shown = (KB.glossary || []).filter(function (t) { return (wordState.cat === "all" || t.cat === wordState.cat) && (!q || norm(t.term + " " + t.desc + " " + t.pro).indexOf(q) >= 0); });
      fill(list, shown.length ? shown.map(function (t) {
        return el("div", { class: "term" }, [el("div", { class: "n", text: t.term }), el("div", { class: "d", text: t.desc }), audience === "pro" && t.pro ? el("div", { class: "p", text: "⚡ " + t.pro }) : null]);
      }) : [el("div", { class: "empty", text: "見つかりませんでした" })]);
    }
    input.addEventListener("input", function () { wordState.query = input.value; draw(); });
    root.appendChild(input); root.appendChild(chips); root.appendChild(list); draw();
  }

  // ---------- ⚠️ リスク ----------
  var riskArea = "all";
  function riskMetrics() {
    var out = [];
    function card(label, big, dir, desc, src) {
      return el("div", { class: "metric" }, [el("div", { class: "label", text: label }), el("div", { class: "big " + (dir < 0 ? "down" : dir > 0 ? "up" : ""), text: big }),
        el("div", { class: "desc", text: desc }), src ? el("div", { class: "src", text: src }) : null]);
    }
    // KAIA：最高値からの下落率
    var fb = (KB && KB.risk_fallback) || {};
    var ath = L.ath ? L.ath.ath : fb.kaia_ath_usd, athDate = L.ath ? L.ath.athDate : fb.kaia_ath_date;
    var atl = L.ath ? L.ath.atl : fb.kaia_atl_usd, atlDate = L.ath ? L.ath.atlDate : fb.kaia_atl_date;
    var usd = L.ath ? L.ath.price : (L.kaia && L.kaia.usd);
    if (ath && usd) {
      var fromAth = (usd / ath - 1) * 100;
      out.push(card("KAIA：過去最高値から", pct(fromAth, true), -1,
        "最高値 $" + ath.toFixed(4) + "（" + ymd(String(athDate).slice(0, 10)) + "）→ 今 $" + usd.toFixed(4) + "。最安値 $" + (atl || 0).toFixed(4) + "（" + ymd(String(atlDate).slice(0, 10)) + "）からは " + pct((usd / atl - 1) * 100, true),
        L.ath ? "CoinGecko " + hm(new Date(L.ath.at)) : "控えの値（" + (KB.as_of ? ymd(KB.as_of) : "") + "時点の最高値）と今の価格"));
    }
    // JPYC：90日の最高からの減少
    if (L.jpycHist && L.jpycHist.points.length) {
      var pts = L.jpycHist.points.slice(-90), peak = pts[0];
      pts.forEach(function (p) { if (p.v > peak.v) peak = p; });
      var nowJ = L.jpyc ? L.jpyc.total : pts[pts.length - 1].v;
      if (peak.v > nowJ) peak = peak; else peak = { v: nowJ, t: Date.now() };
      var dd = (nowJ / peak.v - 1) * 100;
      out.push(card("JPYC流通量：90日の最高から", dd < -0.05 ? pct(dd, true) : "最高を更新中", dd < -0.05 ? -1 : 1,
        "最高 " + oku(peak.v) + "（" + mdw(peak.t) + "）→ 今 " + oku(nowJ), "ブロックチェーン・DefiLlama"));
    }
    // Kaia TVL
    if (L.tvlHist && L.tvlHist.length > 30) {
      var t = L.tvlHist.slice(-90), last = t[t.length - 1].v, first = t[0].v, hi = Math.max.apply(null, t.map(function (x) { return x.v; }));
      var ch = (last / first - 1) * 100;
      out.push(card("KaiaのDeFi預かり（TVL）：90日で", pct(ch, true), ch < 0 ? -1 : 1, "今 $" + oku(last) + "。90日の最高 $" + oku(hi) + " からは " + pct((last / hi - 1) * 100, true), "DefiLlama"));
    }
    // Kaia上の円ステーブルコイン
    var n = (DATA && DATA.numbers) || {};
    if (n.jpy && n.jpy_30d) {
      var c2 = (n.jpy / n.jpy_30d - 1) * 100;
      out.push(card("Kaia上の円ステーブルコイン：30日で", pct(c2, true), c2 < 0 ? -1 : 1, "今 " + oku(n.jpy) + "円", "DefiLlama"));
    }
    // Unifiの率の下がり方
    var r = L.rates || (DATA && DATA.unifi) || {};
    if (r.usdt || r.jpyc) {
      out.push(card("Unifiのリワード率：始まりと今", "最大8% → " + (r.usdt ? rate(r.usdt.baseRate) : "—"), -1,
        "USDTはローンチ時 最大年8%、今はBASIC 年" + (r.usdt ? rate(r.usdt.baseRate) : "—") + "（PLUS " + (r.usdt ? rate(r.usdt.plusBaseRate) : "—") + "）。JPYCは年5%キャンペーン → 今 年" + (r.jpyc ? rate(r.jpyc.baseRate) : "—") + "。", L.rates ? "Unifi公式 " + hm(new Date(L.rates.at)) : "控えの値"));
    }
    out.push(card("KAIAの発行：上限なし", "年 +約5.2%", -1, "1ブロック 9.6 KAIA・年 約3億KAIA", "Kaia公式ドキュメント"));
    return out;
  }
  function riskCard(r) {
    return el("article", { class: "risk lv-" + r.level }, [
      el("div", { class: "row" }, [el("span", { class: "lvl lv-" + r.level, text: "危険度 " + r.level }), topicTag(r.area)]),
      el("div", { class: "t", text: r.title }),
      el("div", { class: "what", text: r.what }),
      el("dl", null, [el("dt", { text: "根拠・数字" }), el("dd", { text: r.evidence }), r.tip ? el("dt", { text: "自分でできること" }) : null, r.tip ? el("dd", { text: r.tip }) : null]),
      (r.src || []).length ? el("div", { class: "srcs" }, r.src.map(function (s) { return el("a", { href: s.u, target: "_blank", rel: "noopener", text: "🔗 " + s.t + (s.d ? "（" + ymd(s.d) + "）" : "") }); })) : null
    ]);
  }
  function datedRow(e, extra) {
    var today = todayJst(), future = e.d >= today.slice(0, e.d.length);
    return el("div", { class: "ev" + (future ? "" : " past") }, [
      el("span", { class: "d", text: ymd(e.d) }),
      el("span", null, [el("span", { class: "dotc", style: "background:" + (CAT_COLORS[e.area] || "var(--ink-3)") }), e.u ? el("a", { href: e.u, target: "_blank", rel: "noopener", text: e.t }) : e.t,
        extra ? el("div", { class: "small muted", text: extra }) : null]),
      el("span", { class: "left", text: future ? (e.d.length === 10 ? "あと" + Math.round((new Date(e.d + "T00:00:00+09:00") - new Date(today + "T00:00:00+09:00")) / 86400000) + "日" : "予定") : "" })
    ]);
  }
  var riskSig = "";
  function renderRisk(force) {
    var root = document.getElementById("risk");
    var sig = [L.ath && L.ath.at, L.jpyc && Math.round(L.jpyc.total / 1e6), L.tvlHist && L.tvlHist.length, L.rates && L.rates.at, allNews().length, riskArea].join("|");
    if (!force && sig === riskSig && root.childNodes.length) return;
    riskSig = sig;
    root.innerHTML = "";
    if (!KB) return;
    root.appendChild(el("div", { class: "sec-title", style: "margin-top:0", text: "😈 はじめての人がまず知っておくこと" }));
    root.appendChild(el("div", { class: "list" }, (KB.beginner_risks || []).map(function (r) {
      return el("div", { class: "li" }, [el("div", { class: "t", text: r.t }), el("div", { class: "small muted", text: r.d })]);
    })));
    root.appendChild(el("div", { class: "sec-title", text: "😈 数字で見る下向きのサイン" }));
    root.appendChild(el("div", { class: "metrics" }, riskMetrics()));
    // 注意が必要なニュース
    var neg = allNews().filter(function (x) { return negHit(x); });
    root.appendChild(el("div", { class: "sec-title" }, ["😈 注意が必要なニュース（直近2週間 " + neg.length + "件）"]));
    root.appendChild(el("div", { class: "list" }, neg.length ? neg.slice(0, 20).map(newsItem) : [el("div", { class: "empty", text: "この2週間は見つかりませんでした" })]));
    // 条件が悪くなった変更
    var dg = (KB.downgrades || []).slice().sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    root.appendChild(el("div", { class: "sec-title", text: "😈 条件が悪くなった変更" }));
    root.appendChild(el("div", { class: "list" }, dg.map(function (e) { return datedRow(e, e.why); })));
    // 知っておきたいリスク
    root.appendChild(el("div", { class: "sec-title", text: "😈 知っておきたいリスク" }));
    var areas = [["all", "すべて"], ["unifi", "📱 Unifi"], ["jpyc", "💴 JPYC"], ["kaia", "🟢 Kaia"], ["common", "🛡 共通"]];
    var list = el("div");
    var chips = el("div", { class: "chips" });
    function draw() {
      fill(chips, areas.map(function (a) { return el("button", { class: "chip", type: "button", "aria-pressed": String(riskArea === a[0]), onclick: function () { riskArea = a[0]; draw(); } }, [a[1]]); }));
      var order = { "高": 0, "中": 1, "低": 2 };
      fill(list, (KB.risks || []).filter(function (r) { return riskArea === "all" || r.area === riskArea; })
        .sort(function (a, b) { return order[a.level] - order[b.level]; }).map(riskCard));
    }
    root.appendChild(chips); root.appendChild(list); draw();
    // 過去の事故
    root.appendChild(el("div", { class: "sec-title", text: "😈 過去に起きた事故・トラブル・悪いニュース" }));
    root.appendChild(el("div", { class: "list" }, (KB.incidents || []).slice().sort(function (a, b) { return a.d < b.d ? 1 : -1; }).map(function (e) { return datedRow(e); })));
  }

  var RENDER = { home: buildHome, guide: renderGuide, risk: function () { renderRisk(true); }, news: function () { renderNews(true); }, market: renderMarket, learn: renderLearn, words: renderWords };
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var current = "home";
  function show(name) {
    if (!RENDER[name]) name = "home";
    current = name;
    tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.tab === name)); });
    Object.keys(RENDER).forEach(function (k) { document.getElementById(k).hidden = k !== name; });
    store("watch.tab", name);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
    if (name === "market") fetchKaiaChart(kaiaDays).then(function () { if (current === "market") renderMarket(); });
    if (name === "news") { renderNews(false); newsOpened = true; updateBadge(); saveSeen(); }
    if (name === "risk") renderRisk(false);
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.dataset.tab); window.scrollTo(0, 0); }); });
  function safe(fn) { try { fn(); } catch (e) { if (window.console) console.error(e); } }
  var newsOpened = false;
  function updateBadge() {
    var b = document.querySelector('.tab[data-tab="news"] .tab-n');
    if (!b) return;
    var n = newsOpened ? 0 : allNews().filter(function (x) { return !isDev(x) && isNew(x); }).length;
    b.hidden = !n;
    b.textContent = n > 99 ? "99+" : String(n);
  }
  var ratesSig = "";
  function refreshViews() {
    safe(updateBadge);
    var rs = JSON.stringify(rateValues());
    if (rs !== ratesSig) { ratesSig = rs; safe(renderLearn); safe(renderWords); safe(renderGuide); }
    safe(updateHome);
    if (current === "news") safe(function () { renderNews(false); });
    if (current === "market") safe(renderMarket);
    if (current === "risk") safe(function () { renderRisk(false); });
  }
  // 種類ごとに間隔を変えて取りに行く（画面を閉じている間は止める）
  var JOBS = [
    { every: 10e3, run: fetchBlock },
    { every: 60e3, run: fetchJpyc },
    { every: 120e3, run: fetchKaia },
    { every: 5 * 60e3, run: function () { return Promise.all([fetchRates(), fetchAnn(), fetchSite()]); } },
    { every: 30 * 60e3, run: function () { return Promise.all([fetchKaiaChart(30), fetchJpycHist(), fetchTvl(), fetchKaiaAth()]); } }
  ];
  function tick() {
    if (document.hidden) return;
    JOBS.forEach(function (j) {
      if (j.busy || (j.last && Date.now() - j.last < j.every)) return;
      j.busy = true; j.last = Date.now();
      Promise.resolve(j.run()).then(function () { j.busy = false; refreshViews(); }, function () { j.busy = false; });
    });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });

  Promise.all([fetchSite(), getJson(KB_URL + "?t=" + Math.floor(Date.now() / 600000)).then(function (d) { KB = d; }).catch(function () { KB = null; })]).then(function () {
    document.getElementById("loading").remove();
    prepareCards();
    Object.keys(RENDER).forEach(function (k) { safe(RENDER[k]); });
    var start = (location.hash || "").slice(1) || store("watch.tab") || "home";
    show(RENDER[start] ? start : "home");
    tick();
    setInterval(tick, 5000);
  });
})();
</script>
