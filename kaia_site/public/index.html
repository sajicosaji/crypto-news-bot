  function svgEl(tag, attrs) { var n = document.createElementNS("http://www.w3.org/2000/svg", tag); Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); }); return n; }

      var shown = (KB.glossary || []).filter(function (t) { return (wordState.cat === "all" || t.cat === wordState.cat) && (!q || norm(t.term + " " + t.desc + " " + t.pro).indexOf(q) >= 0); });
      fill(list, shown.length ? shown.map(function (t) {
        return el("div", { class: "term" }, [el("div", { class: "n", text: t.term }), el("div", { class: "d", text: t.desc }), audience === "pro" && t.pro ? el("div", { class: "p", text: "⚡ " + t.pro }) : null]);
      }) : [el("div", { class: "empty", text: "見つかりませんでした" })]);
    }
    input.addEventListener("input", function () { wordState.query = input.value; draw(); });
    root.appendChild(input); root.appendChild(chips); root.appendChild(list); draw();
  }

  // ---------- 🔌 情報源 ----------
  var SOURCES = [
    ["kaia", "KAIAの価格", "CoinGecko", "https://www.coingecko.com/ja/coins/kaia", "1分ごと"],
    ["jpyc-Polygon", "JPYC流通量（Polygon）", "ブロックチェーン（publicnode）", "https://polygonscan.com/token/0xe7c3d8c9a439fede00d2600032d5db0be71c3c29", "1分ごと"],
    ["jpyc-Ethereum", "JPYC流通量（Ethereum）", "ブロックチェーン（publicnode）", "https://etherscan.io/token/0xe7c3d8c9a439fede00d2600032d5db0be71c3c29", "1分ごと"],
    ["jpyc-Kaia", "JPYC流通量（Kaia）", "Kaia公開ノード", "https://kaiascan.io/token/0xe7c3d8c9a439fede00d2600032d5db0be71c3c29", "1分ごと"],
    ["jpyc-Avalanche", "JPYC流通量（Avalanche）", "ブロックチェーン（publicnode）", "https://snowtrace.io/token/0xe7c3d8c9a439fede00d2600032d5db0be71c3c29", "1分ごと"],
    ["jpycHist", "JPYC流通量の推移", "DefiLlama", "https://defillama.com/stablecoin/jpy-coin", "1時間ごと"],
    ["rates", "Unifiのリワード率", "Unifi公式サイト", "https://www.unifi.me/", "5分ごと"],
    ["ann", "Unifiのお知らせ", "Unifi公式サイト", "https://www.unifi.me/announcement?lng=ja-JP", "5分ごと"],
    ["block", "Kaiaのブロック・ガス代", "Kaia公開ノード", "https://kaiascan.io/", "10秒ごと"],
    ["tvl", "KaiaのDeFi預かり（TVL）", "DefiLlama", "https://defillama.com/chain/kaia", "30分ごと"],
    ["superearn", "SuperEarnの預かり", "DefiLlama", "https://defillama.com/protocol/superearn", "30分ごと"],
    ["site", "ニュース・毎朝のまとめ・毎日の記録", "このサイトの自動収集（GitHub）", "https://github.com/sajicosaji/crypto-news-bot", "5分ごとに確認（集めるのは1時間おき）"]
  ];
  function renderSources() {
    var root = document.getElementById("sources");
    root.innerHTML = "";
    root.appendChild(el("p", { class: "howto", text: "このページは、開いている間、下の公開データを直接読みに行って自動で更新します。" }));
    root.appendChild(el("div", { class: "card" }, [el("h2", { text: "リアルタイムのデータ" })].concat(SOURCES.map(function (s) {
      var st = STATUS[s[0]];
      return el("div", { class: "src-row" }, [
        el("span", { text: !st ? "…" : st.ok ? "✅" : "⚠️" }),
        el("span", null, [el("b", { text: s[1] }), el("br"), el("a", { class: "small muted", href: s[3], target: "_blank", rel: "noopener", text: s[2] }), el("span", { class: "small muted", text: "・" + s[4] })]),
        el("span", { class: "w", text: st ? (st.ok ? hms(new Date(st.at)) : "取得できず（再試行中）") : "確認中" })
      ]);
    }))));
    var s = (DATA && DATA.status) || {};
    var src = (s.sources && s.sources.sources) || [];
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: "ニュースを集めている情報源（" + src.filter(function (x) { return x.ok; }).length + "/" + src.length + "）" }),
      el("p", { class: "small muted", style: "margin:0 0 6px", text: "1時間おきに見に行っています。" + (s.sources && s.sources.checked_at ? "最後に見に行った時刻 " + mdw(s.sources.checked_at) + " " + hm(parseDate(s.sources.checked_at)) : "") })
    ].concat(src.map(function (x) {
      return el("div", { class: "src-row" }, [el("span", { text: x.ok ? "✅" : "⚠️" }), el("span", { text: x.name }), el("span", { class: "w", text: x.ok ? "新着 " + x.added : "取得できず" })]);
    }))));
    if (KB && KB.links) {
      KB.links.forEach(function (g) {
        root.appendChild(el("div", { class: "card" }, [el("h2", { text: "🔗 公式の入口：" + g.group })].concat(g.items.map(function (x) {
          return el("div", { class: "src-row" }, [el("span", { text: "↗" }), el("a", { href: x.u, target: "_blank", rel: "noopener", text: x.t }), el("span", { class: "w", text: host(x.u) })]);
        }))));
      });
    }
  }

  // ---------- 起動・自動更新 ----------
  var RENDER = { home: buildHome, news: function () { renderNews(true); }, market: renderMarket, schedule: renderSchedule, learn: renderLearn, words: renderWords, sources: renderSources };
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var current = "home";
  function show(name) {
    if (!RENDER[name]) name = "home";
    current = name;
    tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.tab === name)); });
    Object.keys(RENDER).forEach(function (k) { document.getElementById(k).hidden = k !== name; });
    store("watch.tab", name);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
    if (name === "market") fetchKaiaChart(kaiaDays).then(function () { if (current === "market") renderMarket(); });
    if (name === "sources") renderSources();
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.dataset.tab); window.scrollTo(0, 0); }); });
  function safe(fn) { try { fn(); } catch (e) { if (window.console) console.error(e); } }
  function refreshViews() {
    safe(updateHome);
    if (current === "news") safe(function () { renderNews(false); });
    if (current === "market") safe(renderMarket);
    if (current === "sources") safe(renderSources);
  }
  // 種類ごとに間隔を変えて取りに行く（画面を閉じている間は止める）
  var JOBS = [
    { every: 10e3, run: fetchBlock },
    { every: 60e3, run: function () { return Promise.all([fetchKaia(), fetchJpyc()]); } },
    { every: 5 * 60e3, run: function () { return Promise.all([fetchRates(), fetchAnn(), fetchSite()]); } },
    { every: 30 * 60e3, run: function () { return Promise.all([fetchKaiaChart(30), fetchJpycHist(), fetchTvl()]); } }
  ];
  function tick() {
    if (document.hidden) return;
    JOBS.forEach(function (j) {
      if (j.busy || (j.last && Date.now() - j.last < j.every)) return;
      j.busy = true; j.last = Date.now();
      Promise.resolve(j.run()).then(function () { j.busy = false; refreshViews(); }, function () { j.busy = false; });
    });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });

  Promise.all([fetchSite(), getJson(KB_URL + "?t=" + Math.floor(Date.now() / 600000)).then(function (d) { KB = d; }).catch(function () { KB = null; })]).then(function () {
    document.getElementById("loading").remove();
    prepareCards();
    Object.keys(RENDER).forEach(function (k) { safe(RENDER[k]); });
    var start = (location.hash || "").slice(1) || store("watch.tab") || "home";
    show(RENDER[start] ? start : "home");
    tick();
    setInterval(tick, 5000);
  });
})();
</script>
</body>
