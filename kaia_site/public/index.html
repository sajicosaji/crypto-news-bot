<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kaia・JPYC デスク</title>
<meta name="description" content="Kaia・JPYCのニュースまとめと発信の準備をする場所">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151a12'/%3E%3Cpath d='M20 16v32M20 33l18-17M27 27l13 21' stroke='%23BFF009' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5ef;
  --surface: #ffffff;
  --surface-2: #eef0e6;
  --ink: #15180f;
  --ink-2: #4b5143;
  --ink-3: #7b8270;
  --line: #dde1d2;
  --accent: #bff009;
  --accent-ink: #15180f;
  --accent-strong: #5b7a00;
  --kaia: #4f7a00;
  --kaia-bg: #ecf8c4;
  --jpyc: #1d5fd1;
  --jpyc-bg: #e1ebff;
  --both: #0b7a6c;
  --both-bg: #d8f3ee;
  --stable: #8a5a00;
  --stable-bg: #f8ecd2;
  --warn: #a64b00;
  --warn-bg: #fff1e0;
  --bad: #b3261e;
  --bad-bg: #fde8e6;
  --good: #2f7d32;
  --shadow: 0 1px 2px rgba(20, 24, 12, .06), 0 4px 16px rgba(20, 24, 12, .05);
  --radius: 14px;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e110c;
    --surface: #171b14;
    --surface-2: #1f251b;
    --ink: #eef2e6;
    --ink-2: #b9c0ad;
    --ink-3: #848c78;
    --line: #2c3326;
    --accent: #bff009;
    --accent-ink: #11140c;
    --accent-strong: #c9f53a;
    --kaia: #c9f53a;
    --kaia-bg: #26300f;
    --jpyc: #8fb4ff;
    --jpyc-bg: #17233d;
    --both: #63d6c4;
    --both-bg: #11302b;
    --stable: #f0c06a;
    --stable-bg: #33270f;
    --warn: #ffb86b;
    --warn-bg: #36240f;
    --bad: #ff8a80;
    --bad-bg: #3a1714;
    --good: #81c784;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e110c; --surface: #171b14; --surface-2: #1f251b; --ink: #eef2e6; --ink-2: #b9c0ad; --ink-3: #848c78;
  --line: #2c3326; --accent-strong: #c9f53a; --kaia: #c9f53a; --kaia-bg: #26300f; --jpyc: #8fb4ff; --jpyc-bg: #17233d;
  --both: #63d6c4; --both-bg: #11302b; --stable: #f0c06a; --stable-bg: #33270f; --warn: #ffb86b; --warn-bg: #36240f;
  --bad: #ff8a80; --bad-bg: #3a1714; --good: #81c784; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: inherit; }
button { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* ヘッダー */
header.top { padding: 18px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: #151a12; display: grid; place-items: center; flex: none; }
.mark svg { width: 22px; height: 22px; }
.brand h1 { font-size: 18px; line-height: 1.2; margin: 0; letter-spacing: .02em; }
.brand .sub { font-size: 12px; color: var(--ink-3); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.badge.prep { background: var(--accent); color: var(--accent-ink); }
.badge.ai { background: var(--both-bg); color: var(--both); }
.badge.headline { background: var(--surface-2); color: var(--ink-2); }
.updated { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }

/* タブ */
nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 11px 12px 10px; font-size: 14px; color: var(--ink-3); cursor: pointer; border-bottom: 2.5px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent-strong); }

main { padding: 16px 0 48px; }
section[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* 今日 */
.lead-date { font-size: 13px; color: var(--ink-3); }
.lead-title { font-size: 19px; font-weight: 800; margin: 2px 0 6px; line-height: 1.45; }
.reason { font-size: 13px; color: var(--ink-2); }
.box-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.box-head h3 { font-size: 14px; margin: 0; }
.box-head .count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
pre.text { white-space: pre-wrap; word-break: break-word; margin: 0; padding: 14px; background: var(--surface-2); border-radius: 10px; font: inherit; font-size: 14.5px; line-height: 1.75; max-height: 62vh; overflow: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.x { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.done { background: var(--both-bg); border-color: var(--both-bg); color: var(--both); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.info { background: var(--surface-2); color: var(--ink-2); }
.notice ul { margin: 4px 0 0; padding-left: 1.2em; }
.empty { text-align: center; padding: 34px 16px; color: var(--ink-3); }
.empty .big { font-size: 30px; margin-bottom: 6px; }

/* ニュース */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 10px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin: 18px 2px 8px; }
.news { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.news a.title { display: block; font-weight: 700; text-decoration: none; line-height: 1.5; }
.news a.title:hover { text-decoration: underline; }
.news .orig { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.topic { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
.topic.kaia { background: var(--kaia-bg); color: var(--kaia); }
.topic.jpyc { background: var(--jpyc-bg); color: var(--jpyc); }
.topic.both { background: var(--both-bg); color: var(--both); }
.topic.stablecoin { background: var(--stable-bg); color: var(--stable); }
.flag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
.flag.bad { background: var(--bad-bg); color: var(--bad); }
.flag.warn { background: var(--warn-bg); color: var(--warn); }
.flag.done { background: var(--surface-2); color: var(--ink-2); }
details.others { margin-top: 6px; font-size: 12.5px; }
details.others summary { cursor: pointer; color: var(--ink-3); }
details.others a { display: block; color: var(--ink-2); padding: 2px 0; }

/* 履歴 */
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
details.hist > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
details.hist > summary::-webkit-details-marker { display: none; }
details.hist > summary .d { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 64px; }
details.hist > summary .h { flex: 1; font-size: 14px; }
details.hist .inner { padding: 0 14px 14px; }

/* 数字 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .label { font-size: 12.5px; color: var(--ink-3); }
.stat .value { font-size: 26px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.3; margin: 2px 0; }
.stat .value small { font-size: 14px; font-weight: 600; margin-left: 2px; }
.stat .exact { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.delta { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.spark { width: 100%; height: 56px; margin-top: 8px; display: block; }
.spark path.line { fill: none; stroke: var(--jpyc); stroke-width: 2; }
.spark path.area { fill: var(--jpyc-bg); }

/* 豆知識 */
.topic-group h3 { font-size: 14px; margin: 18px 2px 8px; }
.tip { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; text-decoration: none; }
.tip .t { flex: 1; font-weight: 600; }
.tip .host { font-size: 11.5px; color: var(--ink-3); }

/* 準備状況 */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 800; }
.dot.ok { background: var(--both-bg); color: var(--both); }
.dot.wait { background: var(--warn-bg); color: var(--warn); }
.dot.ng { background: var(--bad-bg); color: var(--bad); }
.dot.off { background: var(--surface-2); color: var(--ink-3); }
.check .what { font-weight: 700; }
.check .how { font-size: 13px; color: var(--ink-2); }
.todo { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.todo:last-child { border-bottom: 0; }
.todo input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent-strong); flex: none; }
.todo.checked .what { text-decoration: line-through; color: var(--ink-3); }
.src-list { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.src-list li { display: flex; gap: 8px; padding: 2px 0; }
.src-list .n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* 読む人の切り替え */
.howto { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
.audience { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.aud { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; line-height: 1.35; }
.aud .n { display: block; font-weight: 800; font-size: 15px; }
.aud .d { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.aud[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--kaia-bg); }
.aud[aria-pressed="true"] .d { color: var(--ink-2); }
.copy-card { border: 1.5px solid var(--accent-strong); }
.copy-card .big-copy { width: 100%; min-height: 50px; font-size: 16px; margin-top: 4px; }
.copy-card details { margin-top: 10px; }
.copy-card summary { cursor: pointer; font-size: 13px; color: var(--ink-3); }
.copy-card pre.text { margin-top: 8px; }
.sec-label { font-size: 13px; font-weight: 800; color: var(--ink-2); margin: 18px 2px 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; }
.item .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 800; font-size: 15.5px; line-height: 1.5; }
.item .s { margin-top: 4px; color: var(--ink-2); }
.item .p { margin-top: 8px; background: var(--kaia-bg); color: var(--ink); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.item .src { margin-top: 8px; font-size: 12.5px; }
.item .src a { color: var(--ink-3); }
.words dt { font-weight: 800; margin-top: 10px; }
.words dt:first-child { margin-top: 0; }
.words dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.stat .explain { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }

footer { color: var(--ink-3); font-size: 12px; text-align: center; padding: 8px 16px 28px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.toast.show { opacity: 1; }
.loading { padding: 40px 0; text-align: center; color: var(--ink-3); }
@media (max-width: 420px) {
  .lead-title { font-size: 17.5px; }
  .stat .value { font-size: 23px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M20 12v40M20 34l20-22M28 27l14 25" stroke="#BFF009" stroke-width="8" stroke-linecap="round" fill="none"/></svg></div>
    <div>
      <h1>Kaia・JPYC デスク</h1>
      <div class="sub">Kaia・JPYCのニュースを毎朝わかりやすく <span id="prepBadge" class="badge prep" hidden>準備期間</span></div>
    </div>
    <div class="updated" id="updated"></div>
  </div>
</header>
<nav class="tabs" aria-label="ページの切り替え">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">📰 今日</button>
    <button class="tab" role="tab" data-tab="news" aria-selected="false">🗞 ニュース</button>
    <button class="tab" role="tab" data-tab="history" aria-selected="false">📚 履歴</button>
    <button class="tab" role="tab" data-tab="numbers" aria-selected="false">📊 数字</button>
    <button class="tab" role="tab" data-tab="topics" aria-selected="false">💡 豆知識</button>
    <button class="tab" role="tab" data-tab="status" aria-selected="false">✅ 準備</button>
  </div>
</nav>
<main class="wrap">
  <div id="loading" class="loading">読み込み中…</div>
  <section id="today" hidden></section>
  <section id="news" hidden></section>
  <section id="history" hidden></section>
  <section id="numbers" hidden></section>
  <section id="topics" hidden></section>
  <section id="status" hidden></section>
</main>
<footer>
  毎朝7時にまとめ、3時間おきにニュース一覧を自動で更新しています。<br>
  情報共有が目的で、投資を勧めるものではありません。
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var DATA_URL = "https://raw.githubusercontent.com/sajicosaji/crypto-news-bot/kaia-data/kaia/site.json";
  var TOPIC_NAMES = { both: "Kaia × JPYC", kaia: "Kaia", jpyc: "JPYC", stablecoin: "円ステーブルコイン" };
  var WEEK = "日月火水木金土";

  // ---------- 小さな道具 ----------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function store(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, value);
    } catch (e) { return null; }
    return null;
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function copyText(text, button) {
    function done() {
      toast("コピーしました");
      if (button) {
        var label = button.textContent;
        button.classList.add("done");
        button.textContent = "✓ コピー済み";
        setTimeout(function () { button.classList.remove("done"); button.textContent = label; }, 1800);
      }
    }
    function fallback() {
      var ta = el("textarea", { style: "position:fixed;top:-1000px;opacity:0", readonly: true });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) done(); else toast("コピーできませんでした。長押しで選んでください");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }
  function xWeight(text) {
    text = text.replace(/https?:\/\/\S+/g, "x".repeat(23));
    var n = 0;
    for (var ch of text.normalize("NFC")) {
      var cp = ch.codePointAt(0);
      if (cp === 0xFE0F || cp === 0xFE0E) continue;
      n += (cp <= 0x10FF || (cp >= 0x2000 && cp <= 0x200D) || (cp >= 0x2010 && cp <= 0x201F) || (cp >= 0x2032 && cp <= 0x2037)) ? 1 : 2;
    }
    return n;
  }
  function parseDate(iso) { var d = new Date(iso); return isNaN(d) ? null : d; }
  function jstParts(d) {
    var j = new Date(d.getTime() + 9 * 3600 * 1000);
    return { y: j.getUTCFullYear(), m: j.getUTCMonth() + 1, d: j.getUTCDate(), w: WEEK[j.getUTCDay()], h: j.getUTCHours(), mi: j.getUTCMinutes() };
  }
  function mdw(iso) {
    var d = parseDate(iso.length === 10 ? iso + "T12:00:00+09:00" : iso);
    if (!d) return iso;
    var p = jstParts(d);
    return p.m + "/" + p.d + "（" + p.w + "）";
  }
  function hm(d) { var p = jstParts(d); return p.h + ":" + String(p.mi).padStart(2, "0"); }
  function ago(iso) {
    var d = parseDate(iso);
    if (!d) return "";
    var s = (Date.now() - d.getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "分前";
    if (s < 86400) return Math.round(s / 3600) + "時間前";
    return Math.round(s / 86400) + "日前";
  }
  function todayJst() { var p = jstParts(new Date()); return p.y + "-" + String(p.m).padStart(2, "0") + "-" + String(p.d).padStart(2, "0"); }
  function jaAmount(x) {
    if (x >= 1e8) return (x / 1e8).toFixed(2) + "億";
    if (x >= 1e4) return Math.round(x / 1e4).toLocaleString("ja-JP") + "万";
    return Math.round(x).toLocaleString("ja-JP");
  }
  function delta(now, before) {

  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  function show(name) {
    if (!RENDER[name]) name = "today";
    tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.tab === name)); });
    Object.keys(RENDER).forEach(function (k) { document.getElementById(k).hidden = k !== name; });
    store("kaia.tab", name);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.dataset.tab); window.scrollTo(0, 0); }); });

  fetch(DATA_URL + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      document.getElementById("loading").remove();
      if (data.prep_mode) document.getElementById("prepBadge").hidden = false;
      var up = parseDate(data.updated_at);
      if (up) document.getElementById("updated").innerHTML = "";
      if (up) document.getElementById("updated").append("更新 " + mdw(data.updated_at) + " " + hm(up), el("br"), ago(data.updated_at));
      Object.keys(RENDER).forEach(function (k) {
        try { RENDER[k](data, document.getElementById(k)); }
        catch (e) { document.getElementById(k).appendChild(el("div", { class: "notice bad", text: "この部分を表示できませんでした" })); }
      });
      show((location.hash || "").slice(1) || store("kaia.tab") || "today");
    })
    .catch(function () {
      document.getElementById("loading").textContent = "データを読み込めませんでした。少し時間をおいて開き直してください。";
    });
})();
</script>
</body>
</html>
