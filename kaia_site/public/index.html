<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Unifi・JPYC・Kaia デスク</title>
<meta name="description" content="Unifiアンバサダーの準備と回答集。Unifi・JPYC・Kaiaをやさしく、正確に説明するための場所">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315201a'/%3E%3Cpath d='M14 20a8 8 0 0 1 8-8h20a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8H30l-9 8v-8h1a8 8 0 0 1-8-8z' fill='none' stroke='%2337d67a' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M25 22l7 8 7-8M32 30v10M26 31h12' stroke='%2337d67a' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface-2: #ecefe8;
  --ink: #141a15;
  --ink-2: #48514a;
  --ink-3: #78827a;
  --line: #dce1d8;
  --accent: #06c755;
  --accent-ink: #ffffff;
  --accent-strong: #058a3c;
  --accent-soft: #dcf6e6;
  --unifi: #058a3c;
  --unifi-bg: #dcf6e6;
  --kaia: #5b7a00;
  --kaia-bg: #eef8c9;
  --jpyc: #1d5fd1;
  --jpyc-bg: #e1ebff;
  --both: #0b7a6c;
  --both-bg: #d8f3ee;
  --stable: #8a5a00;
  --stable-bg: #f8ecd2;
  --money: #6a4bb5;
  --money-bg: #ece6fb;
  --warn: #a64b00;
  --warn-bg: #fff1e0;
  --bad: #b3261e;
  --bad-bg: #fde8e6;
  --good: #2f7d32;
  --shadow: 0 1px 2px rgba(20, 26, 21, .06), 0 4px 16px rgba(20, 26, 21, .05);
  --radius: 14px;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d110e; --surface: #161c18; --surface-2: #1e2620; --ink: #ecf2ed; --ink-2: #b6c0b8; --ink-3: #829085;
    --line: #2a332c; --accent: #2fd273; --accent-ink: #06210f; --accent-strong: #5fe39a; --accent-soft: #12301f;
    --unifi: #5fe39a; --unifi-bg: #12301f; --kaia: #c9f53a; --kaia-bg: #26300f; --jpyc: #8fb4ff; --jpyc-bg: #17233d;
    --both: #63d6c4; --both-bg: #11302b; --stable: #f0c06a; --stable-bg: #33270f; --money: #c4b0ff; --money-bg: #261d3d;
    --warn: #ffb86b; --warn-bg: #36240f; --bad: #ff8a80; --bad-bg: #3a1714; --good: #81c784;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d110e; --surface: #161c18; --surface-2: #1e2620; --ink: #ecf2ed; --ink-2: #b6c0b8; --ink-3: #829085;
  --line: #2a332c; --accent: #2fd273; --accent-ink: #06210f; --accent-strong: #5fe39a; --accent-soft: #12301f;
  --unifi: #5fe39a; --unifi-bg: #12301f; --kaia: #c9f53a; --kaia-bg: #26300f; --jpyc: #8fb4ff; --jpyc-bg: #17233d;
  --both: #63d6c4; --both-bg: #11302b; --stable: #f0c06a; --stable-bg: #33270f; --money: #c4b0ff; --money-bg: #261d3d;
  --warn: #ffb86b; --warn-bg: #36240f; --bad: #ff8a80; --bad-bg: #3a1714; --good: #81c784;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.75 system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* ヘッダー */
header.top { padding: 18px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: #15201a; display: grid; place-items: center; flex: none; }
.mark svg { width: 26px; height: 26px; }
.brand h1 { font-size: 18px; line-height: 1.25; margin: 0; letter-spacing: .01em; }
.brand .sub { font-size: 12px; color: var(--ink-3); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.badge.prep { background: var(--accent); color: var(--accent-ink); }
.badge.free { background: var(--surface-2); color: var(--ink-2); }
.updated { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }

/* タブ */
nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 11px 11px 10px; font-size: 14px; color: var(--ink-3); cursor: pointer; border-bottom: 2.5px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent-strong); }

main { padding: 16px 0 48px; }
section[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15.5px; margin: 0 0 8px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.howto { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
.sec-title { font-size: 13px; font-weight: 800; color: var(--ink-2); margin: 22px 2px 8px; letter-spacing: .02em; }

/* 読む人の切り替え */
.audience { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.aud { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; text-align: left; cursor: pointer; line-height: 1.35; }
.aud .n { display: block; font-weight: 800; font-size: 14.5px; }
.aud .d { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.aud[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--accent-soft); }
.aud[aria-pressed="true"] .d { color: var(--ink-2); }

/* ボタン・お知らせ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 10px; cursor: pointer; font-size: 13.5px; font-weight: 600; text-decoration: none; min-height: 38px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn:active { transform: translateY(1px); }
.btn.done { background: var(--both-bg); border-color: var(--both-bg); color: var(--both); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.info { background: var(--surface-2); color: var(--ink-2); }
.notice ul { margin: 4px 0 0; padding-left: 1.2em; }
.empty { text-align: center; padding: 30px 16px; color: var(--ink-3); }
.empty .big { font-size: 30px; margin-bottom: 6px; }
pre.text { white-space: pre-wrap; word-break: break-word; margin: 0; padding: 14px; background: var(--surface-2); border-radius: 10px; font: inherit; font-size: 14.5px; line-height: 1.75; max-height: 62vh; overflow: auto; }

/* 今日の1枚 */
.daily { border: 1.5px solid var(--accent-strong); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%); }
.daily .k { font-size: 12px; font-weight: 800; color: var(--accent-strong); letter-spacing: .04em; }
.daily .q { font-size: 17px; font-weight: 800; margin: 2px 0 4px; line-height: 1.5; }
.daily .a { font-size: 15px; }

/* まとめ */
.lead-date { font-size: 13px; color: var(--ink-3); }
.lead-title { font-size: 18px; font-weight: 800; margin: 2px 0 4px; line-height: 1.45; }
.copy-card { border: 1.5px solid var(--accent-strong); }
.copy-card .big-copy { width: 100%; min-height: 48px; font-size: 16px; margin-top: 4px; }
.copy-card details { margin-top: 10px; }
.copy-card summary, details.more summary { cursor: pointer; font-size: 13px; color: var(--ink-3); }
.copy-card pre.text { margin-top: 8px; }
.box-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.box-head h3 { font-size: 14px; margin: 0; }
.box-head .count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; }
.item .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 800; font-size: 15.5px; line-height: 1.5; }
.item .s { margin-top: 4px; color: var(--ink-2); }
.item .p { margin-top: 8px; background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.item .src { margin-top: 8px; font-size: 12.5px; }
.item .src a { color: var(--ink-3); }
.rel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rel button { border: 1px dashed var(--accent-strong); background: transparent; color: var(--accent-strong); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
.words dt { font-weight: 800; margin-top: 10px; }
.words dt:first-child { margin-top: 0; }
.words dd { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
details.hist > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; gap: 10px; align-items: center; }
details.hist > summary::-webkit-details-marker { display: none; }
details.hist > summary .d { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 64px; }
details.hist > summary .h { flex: 1; font-size: 14px; }
details.hist .inner { padding: 0 14px 14px; }

/* チップ・検索 */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 10px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin-bottom: 10px; }
.search:focus { outline: none; border-color: var(--accent-strong); }

/* 説明カード */
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; transition: box-shadow .3s, border-color .3s; }
.qa.flash { border-color: var(--accent-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
.qa .cat { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.qa .q { font-size: 16.5px; font-weight: 800; line-height: 1.5; margin: 2px 0 8px; }
.qa .one { background: var(--accent-soft); border-left: 4px solid var(--accent-strong); border-radius: 6px 10px 10px 6px; padding: 8px 12px; font-weight: 700; }
.qa .body { white-space: pre-line; margin-top: 10px; color: var(--ink); }
.qa .body.pro { font-size: 14px; color: var(--ink-2); }
.qa details.more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.qa details.more .body { margin-top: 6px; }
.qa .caution { margin-top: 10px; background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; }
.qa .srcs { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.qa .srcs a { display: block; color: var(--ink-3); padding: 1px 0; text-decoration: none; }
.qa .srcs a:hover { text-decoration: underline; }

/* データ */
.facts { width: 100%; border-collapse: collapse; font-size: 14px; }
.facts th, .facts td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.facts th { width: 30%; color: var(--ink-2); font-weight: 700; font-size: 13px; }
.facts td .note { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.facts tr:last-child th, .facts tr:last-child td { border-bottom: 0; }
.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tl li:last-child { border-bottom: 0; }
.tl .d { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 13px; }
.tl .future .t { color: var(--ink-3); }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .label { font-size: 12.5px; color: var(--ink-3); }
.stat .value { font-size: 25px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.3; margin: 2px 0; }
.stat .value small { font-size: 14px; font-weight: 600; margin-left: 2px; }
.stat .exact { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stat .explain { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }
.delta { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.spark { width: 100%; height: 56px; margin-top: 8px; display: block; }
.spark path.line { fill: none; stroke: var(--jpyc); stroke-width: 2; }
.spark path.area { fill: var(--jpyc-bg); }
.links a { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 14px; }
.links a:last-child { border-bottom: 0; }
.links a .h { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }

/* ニュース */
.day { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin: 18px 2px 8px; }
.news { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.news a.title { display: block; font-weight: 700; text-decoration: none; line-height: 1.5; }
.news a.title:hover { text-decoration: underline; }
.news .orig { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.topic { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
.topic.unifi { background: var(--unifi-bg); color: var(--unifi); }
.topic.kaia { background: var(--kaia-bg); color: var(--kaia); }
.topic.jpyc { background: var(--jpyc-bg); color: var(--jpyc); }
.topic.both { background: var(--both-bg); color: var(--both); }
.topic.stablecoin, .topic.money { background: var(--stable-bg); color: var(--stable); }
.flag { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
.flag.bad { background: var(--bad-bg); color: var(--bad); }
.flag.warn { background: var(--warn-bg); color: var(--warn); }
.flag.done { background: var(--surface-2); color: var(--ink-2); }
details.others { margin-top: 6px; font-size: 12.5px; }
details.others summary { cursor: pointer; color: var(--ink-3); }
details.others a { display: block; color: var(--ink-2); padding: 2px 0; }

/* 用語 */
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; }
.term .n { font-weight: 800; }
.term .d { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.term .p { color: var(--ink-3); font-size: 13px; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }

/* 心得 */
.dodont { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dodont ul { margin: 0; padding-left: 1.2em; font-size: 14px; }
.dodont li { margin: 4px 0; }
.dodont .ok h3 { color: var(--good); margin-top: 0; }
.dodont .ng h3 { color: var(--bad); margin-top: 0; }
ol.pattern { margin: 0; padding-left: 1.4em; }
.tpl pre.text { font-size: 14px; }

/* 準備 */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 800; }
.dot.ok { background: var(--both-bg); color: var(--both); }
.dot.wait { background: var(--warn-bg); color: var(--warn); }
.dot.ng { background: var(--bad-bg); color: var(--bad); }
.dot.off { background: var(--surface-2); color: var(--ink-3); }
.check .what, .todo .what { font-weight: 700; }
.check .how, .todo .how { font-size: 13px; color: var(--ink-2); }
.todo { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.todo:last-child { border-bottom: 0; }
.todo input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent-strong); flex: none; }
.todo.checked .what { text-decoration: line-through; color: var(--ink-3); }
.src-list { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.src-list li { display: flex; gap: 8px; padding: 2px 0; }
.src-list .n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

footer { color: var(--ink-3); font-size: 12px; text-align: center; padding: 8px 16px 28px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.toast.show { opacity: 1; }
.loading { padding: 40px 0; text-align: center; color: var(--ink-3); }
@media (max-width: 520px) {
  .dodont { grid-template-columns: 1fr; }
  .facts th { width: 34%; }
  .tl li { grid-template-columns: 80px 1fr; }
}
@media (max-width: 420px) {
  .lead-title { font-size: 17px; }
  .stat .value { font-size: 22px; }
  .tab { padding: 11px 9px 10px; font-size: 13.5px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M10 18a8 8 0 0 1 8-8h28a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8H30l-10 9v-9h-2a8 8 0 0 1-8-8z" fill="none" stroke="#37d67a" stroke-width="5" stroke-linejoin="round"/><path d="M24 19l8 9 8-9M32 28v11M25 29h14" stroke="#37d67a" stroke-width="4" stroke-linecap="round" fill="none"/></svg></div>
    <div>
      <h1>Unifi・JPYC・Kaia デスク</h1>
      <div class="sub">アンバサダーの準備と回答集 <span id="prepBadge" class="badge prep" hidden>準備期間</span></div>
    </div>
    <div class="updated" id="updated"></div>
  </div>
</header>
<nav class="tabs" aria-label="ページの切り替え">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">📰 今日</button>
    <button class="tab" role="tab" data-tab="explain" aria-selected="false">💬 説明</button>
    <button class="tab" role="tab" data-tab="data" aria-selected="false">📋 データ</button>
    <button class="tab" role="tab" data-tab="news" aria-selected="false">🗞 ニュース</button>
    <button class="tab" role="tab" data-tab="words" aria-selected="false">📖 用語</button>

</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var DATA_URL = "https://raw.githubusercontent.com/sajicosaji/crypto-news-bot/kaia-data/kaia/site.json";
  var KB_URL = "knowledge.json";
  var TOPIC_NAMES = { unifi: "Unifi", both: "Kaia × JPYC", kaia: "Kaia", jpyc: "JPYC", stablecoin: "円ステーブルコイン", money: "制度", start: "全体像", safety: "安全", talk: "会話" };
  var CAT_COLORS = { unifi: "var(--unifi)", jpyc: "var(--jpyc)", kaia: "var(--kaia)", money: "var(--money)" };
  var WEEK = "日月火水木金土";
  var DATA = null, KB = null;

  // ---------- 小さな道具 ----------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function store(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem(key);
      window.localStorage.setItem(key, value);
    } catch (e) { return null; }
    return null;
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function copyText(text, button) {
    function done() {
      toast("コピーしました");
      if (button) {
        var label = button.textContent;
        button.classList.add("done");
        button.textContent = "✓ コピー済み";
        setTimeout(function () { button.classList.remove("done"); button.textContent = label; }, 1800);
      }
    }
    function fallback() {
      var ta = el("textarea", { style: "position:fixed;top:-1000px;opacity:0", readonly: true });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) done(); else toast("コピーできませんでした。長押しで選んでください");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }
  function copyBtn(label, getText, cls) {
    var b = el("button", { class: "btn " + (cls || "primary"), type: "button" }, [label]);
    b.addEventListener("click", function () { copyText(typeof getText === "function" ? getText() : getText, b); });
    return b;
  }
  function parseDate(iso) { var d = new Date(iso); return isNaN(d) ? null : d; }
  function jstParts(d) {
    var j = new Date(d.getTime() + 9 * 3600 * 1000);
    return { y: j.getUTCFullYear(), m: j.getUTCMonth() + 1, d: j.getUTCDate(), w: WEEK[j.getUTCDay()], h: j.getUTCHours(), mi: j.getUTCMinutes() };
  }
  function mdw(iso) {
    var d = parseDate(iso.length === 10 ? iso + "T12:00:00+09:00" : iso);
    if (!d) return iso;
    var p = jstParts(d);
    return p.m + "/" + p.d + "（" + p.w + "）";
  }
  function ymd(s) {  // "2026-05-15" → "2026/5/15"、"2026-05" → "2026/5"
    var p = String(s).split("-");
    return p[0] + (p[1] ? "/" + Number(p[1]) : "") + (p[2] ? "/" + Number(p[2]) : "");
  }
  function hm(d) { var p = jstParts(d); return p.h + ":" + String(p.mi).padStart(2, "0"); }
  function ago(iso) {
    var d = parseDate(iso);
    if (!d) return "";
    var s = (Date.now() - d.getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + "分前";
    if (s < 86400) return Math.round(s / 3600) + "時間前";
    return Math.round(s / 86400) + "日前";
  }
  function todayJst() { var p = jstParts(new Date()); return p.y + "-" + String(p.m).padStart(2, "0") + "-" + String(p.d).padStart(2, "0"); }
  function jaAmount(x) {
    if (x >= 1e8) return (x / 1e8).toFixed(2) + "億";
    if (x >= 1e4) return Math.round(x / 1e4).toLocaleString("ja-JP") + "万";
    return Math.round(x).toLocaleString("ja-JP");
  }
  function delta(now, before) {
    if (!before) return "";
    var p = (now / before - 1) * 100;
    return (p >= 0 ? "▲ +" : "▼ ") + p.toFixed(1) + "%";
  }
  function host(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
  function topicTag(t) { return el("span", { class: "topic " + (TOPIC_NAMES[t] ? t : "kaia"), text: TOPIC_NAMES[t] || "Kaia" }); }
  function norm(s) { return String(s || "").normalize("NFKC").toLowerCase(); }

  // ---------- 読む人の切り替え ----------
  var AUD = [
    { key: "easy", name: "🔰 はじめての人向け", desc: "やさしい言葉・たとえ話" },
    { key: "pro", name: "⚡ 慣れている人向け", desc: "数字・日付・出典で" }
  ];
  var audience = store("kaia.audience") === "pro" ? "pro" : "easy";
  function audienceSwitch() {
    var box = el("div", { class: "audience", role: "group", "aria-label": "話す相手に合わせて切り替え" });
    AUD.forEach(function (a) {
      box.appendChild(el("button", {
        class: "aud", type: "button", "aria-pressed": String(audience === a.key),
        onclick: function () {
          if (audience === a.key) return;
          audience = a.key;
          store("kaia.audience", audience);
          var y = window.scrollY;
          renderAll();
          window.scrollTo(0, y);

      }, [el("span", { class: "n", text: a.name }), el("span", { class: "d", text: a.desc })]));
    });
    return box;
  }

  // ---------- 説明カードとのつながり ----------
  var cardRes = [];
  function prepareCards() {
    cardRes = [];
    ((KB && KB.cards) || []).forEach(function (c) {
      if (!c.tags) return;
      try { cardRes.push({ card: c, re: new RegExp(c.tags) }); } catch (e) { /* 読めない条件は使わない */ }
    });
    // 「JPYCってなに？」のような広いカードは、具体的なカードより後に出す
    cardRes.sort(function (a, b) { return (a.card.generic ? 1 : 0) - (b.card.generic ? 1 : 0); });
  }
  function relatedCards(text, limit) {
    var out = [];
    for (var i = 0; i < cardRes.length && out.length < (limit || 2); i++) {
      if (cardRes[i].re.test(text)) out.push(cardRes[i].card);
    }
    return out;
  }
  function relButtons(text) {
    var cards = relatedCards(text, 2);
    if (!cards.length) return null;
    return el("div", { class: "rel" }, cards.map(function (c) {
      return el("button", { type: "button", onclick: function () { openCard(c.id); } }, ["💬 説明するなら「" + c.q + "」"]);
    }));
  }
  function openCard(id) {
    explainState.cat = "all";
    explainState.query = "";
    renderExplain();
    show("explain");
    var node = document.getElementById("card-" + id);
    if (node) {
      node.scrollIntoView({ block: "start" });
      node.classList.add("flash");
      setTimeout(function () { node.classList.remove("flash"); }, 1800);
    }
  }
  function cardOfTheDay() {
    var cards = (KB && KB.cards) || [];
    if (!cards.length) return null;
    var p = jstParts(new Date());
    var n = Math.floor(Date.UTC(p.y, p.m - 1, p.d) / 86400000);
    return cards[n % cards.length];
  }

  // ---------- 📰 今日 ----------
  function versionOf(a) {
    var vs = a.versions || [];
    for (var i = 0; i < vs.length; i++) if (vs[i].key === audience) return vs[i];
    if (vs.length) return vs[0];
    return a.community_text ? { key: "pro", label: "コミュニティ向け", text: a.community_text } : null;
  }
  function fieldsOf(it) {
    if (audience === "easy") return { t: it.easy_title || it.title, s: it.easy_summary || it.summary, p: it.easy_point || "" };
    return { t: it.title, s: it.summary, p: it.point || "" };
  }
  function renderEntry(a, container, isToday) {
    var v = versionOf(a);
    var items = a.items || [];
    var lead = a.mode === "ai" || !items.length ? (a.headline || "") : (isToday ? "今日" : mdw(a.date)) + "のニュース " + items.length + "件";
    // AIを使っていた頃の注意書きは、無料モードでは関係ないので出さない
    var warns = (a.warnings || []).filter(function (w) { return w.indexOf("AIの要約") < 0; });
    container.appendChild(el("div", { class: "card" }, [
      el("div", { class: "row" }, [el("span", { class: "lead-date", text: mdw(a.date) + "のまとめ" }), el("span", { class: "spacer" }), el("span", { class: "small muted", text: a.label || "" })]),
      el("div", { class: "lead-title", text: lead }),
      a.mode !== "ai" ? el("p", { class: "small muted", style: "margin:2px 0 0", text: "見出しと記事の一部をそのまま載せています。説明するときは、各ニュースの「💬」から説明カードを開けます。" }) : null,
      warns.length ? el("div", { class: "notice warn" }, ["⚠️ 貼る前に確かめてほしい点", el("ul", null, warns.map(function (w) { return el("li", { text: w }); }))]) : null
    ]));
    if (v && v.text) {
      var big = copyBtn("📋 コピーする", v.text, "primary big-copy");
      container.appendChild(el("div", { class: "card copy-card" }, [
        el("div", { class: "box-head" }, [el("h3", { text: "コミュニティに貼る文章" }), el("span", { class: "count", text: v.text.length + "字" })]),
        el("p", { class: "small muted", style: "margin:-2px 0 6px", text: (a.versions ? (audience === "easy" ? "はじめての人向け" : "慣れている人向け") + "の文章です。" : "") + "LINEオープンチャット・Discordなどにそのまま貼れます。" }),
        big,
        el("details", { open: !items.length }, [el("summary", { text: "貼る文章をそのまま見る" }), el("pre", { class: "text", text: v.text })])
      ]));
    }
    var lastTopic = "";
    items.forEach(function (it, i) {
      if (it.topic !== lastTopic) {
        container.appendChild(el("div", { class: "sec-title" }, [topicTag(it.topic), " の話題"]));
        lastTopic = it.topic;
      }
      var f = fieldsOf(it);
      container.appendChild(el("article", { class: "item" }, [
        el("span", { class: "num", text: String(i + 1) }),
        el("div", { class: "body" }, [
          el("div", { class: "t", text: f.t }),
          f.s ? el("div", { class: "s", text: f.s }) : null,
          f.p ? el("div", { class: "p", text: (audience === "easy" ? "💡 ひとことで言うと：" : "👉 ") + f.p }) : null,
          relButtons((it.title || "") + " " + (it.summary || "")),
          el("div", { class: "src" }, [el("a", { href: it.url, target: "_blank", rel: "noopener", text: "🔗 " + it.source + "（" + it.label + "）の記事を開く" })])
        ])
      ]));
    });
    if (audience === "easy" && a.glossary && a.glossary.length) {
      var dl = el("dl", { class: "words" });
      a.glossary.forEach(function (g) { dl.appendChild(el("dt", { text: g.term })); dl.appendChild(el("dd", { text: g.desc })); });
      container.appendChild(el("div", { class: "card", style: "margin-top:14px" }, [el("h2", { text: "📖 今日のことば" }), dl]));
    }
    if (a.cautions && a.cautions.length) {
      container.appendChild(el("div", { class: "card" }, [
        el("h2", { text: "🔎 知っておきたいニュース" }),
        el("p", { class: "small muted", text: "まとめには入れていません（悪いニュース・注意が必要な話）", style: "margin:0 0 6px" }),
        el("div", null, a.cautions.map(function (c) { return el("a", { href: c.url, target: "_blank", rel: "noopener", style: "display:block;padding:3px 0", text: c.title }); }))
      ]));
    }
  }
  function renderToday(root) {
    root.innerHTML = "";
    root.appendChild(audienceSwitch());
    var c = cardOfTheDay();
    if (c) {
      root.appendChild(el("div", { class: "card daily" }, [
        el("div", { class: "k", text: "今日おぼえる1枚" }),
        el("div", { class: "q", text: "Q. " + c.q }),
        el("div", { class: "a", text: c.one }),
        el("div", { class: "actions" }, [
          el("button", { class: "btn", type: "button", onclick: function () { openCard(c.id); } }, ["💬 くわしい説明を開く"]),
          copyBtn("📋 ひとことをコピー", c.one, "ghost")
        ])
      ]));
    }
    var hour = (DATA && DATA.status && DATA.status.digest_hour) || 7;
    var arc = (DATA && DATA.archive) || [];
    root.appendChild(el("div", { class: "sec-title", text: "📰 ニュースのまとめ" }));
    if (!DATA) {
      root.appendChild(el("div", { class: "notice warn", text: "ニュースのデータを読み込めませんでした。説明・データ・用語・心得のタブは使えます。" }));
      return;
    }
    var a = arc[0];
    if (!a) {
      root.appendChild(el("div", { class: "card empty" }, [el("div", { class: "big", text: "🌱" }), "まだまとめがありません。毎朝" + hour + "時に自動で作られます。"]));
    } else {
      if (a.date !== todayJst()) {
        root.appendChild(el("div", { class: "notice info", style: "margin:0 0 14px", text: "今日のまとめはまだです（毎朝" + hour + "時ごろ。新しいニュースが無い日はお休み）。下は " + mdw(a.date) + " のまとめです。" }));
      }
      renderEntry(a, root, a.date === todayJst());
    }
    if (arc.length > 1) {
      root.appendChild(el("div", { class: "sec-title", text: "📚 これまでのまとめ（" + (arc.length - 1) + "日分）" }));
      arc.slice(1).forEach(function (h) {
        var inner = el("div", { class: "inner" });
        var count = (h.items || []).length;
        var d = el("details", { class: "hist" }, [
          el("summary", null, [el("span", { class: "d", text: mdw(h.date) }), el("span", { class: "h", text: h.mode === "ai" || !count ? (h.headline || "") : "ニュース " + count + "件" })]),
          inner
        ]);
        d.addEventListener("toggle", function () { if (d.open && !inner.childNodes.length) renderEntry(h, inner, false); });
        root.appendChild(d);
      });
    }
  }

  // ---------- 💬 説明 ----------
  var explainState = { cat: store("kaia.explainCat") || "all", query: "" };
  function cardText(c) {
    var lines = [c.one];
    if (audience === "pro" && c.pro) {
      lines.push("", c.pro);
      var srcs = (c.src || []).slice(0, 2).map(function (s) { return "・" + s.t + (s.d ? "（" + ymd(s.d) + "）" : "") + " " + s.u; });
      if (srcs.length) lines.push("", "出典：", srcs.join("\n"));
    } else {
      lines.push("", c.easy);
    }
    return lines.join("\n");
  }
  function qaCard(c) {
    var catLabel = "";
    (KB.categories || []).forEach(function (x) { if (x.id === c.cat) catLabel = x.label; });
    var main = audience === "pro" && c.pro ? el("div", { class: "body pro", text: c.pro }) : el("div", { class: "body", text: c.easy });
    var other = audience === "pro"
      ? el("details", { class: "more" }, [el("summary", { text: "🔰 やさしい言い方を見る" }), el("div", { class: "body", text: c.easy })])
      : (c.pro ? el("details", { class: "more" }, [el("summary", { text: "⚡ 詳しい人に聞かれたら（数字・日付）" }), el("div", { class: "body pro", text: c.pro })]) : null);
    return el("article", { class: "qa", id: "card-" + c.id }, [
      el("div", { class: "cat", text: catLabel }),
      el("div", { class: "q", text: "Q. " + c.q }),
      el("div", { class: "one", text: c.one }),
      main,
      other,
      c.caution ? el("div", { class: "caution", text: "⚠️ " + c.caution }) : null,
      (c.src || []).length ? el("div", { class: "srcs" }, ["出典"].concat((c.src || []).map(function (s) {
        return el("a", { href: s.u, target: "_blank", rel: "noopener", text: "🔗 " + s.t + (s.d ? "（" + ymd(s.d) + "）" : "") });
      }))) : null,
      el("div", { class: "actions" }, [copyBtn("📋 答えをコピー", function () { return cardText(c); }, "")])
    ]);
  }
  function renderExplain() {
    var root = document.getElementById("explain");
    root.innerHTML = "";
    if (!KB) { root.appendChild(el("div", { class: "notice bad", text: "説明カードを読み込めませんでした" })); return; }
    root.appendChild(el("p", { class: "howto", text: "よく聞かれる質問への答え方です。まず「ひとことで」を言って、相手に合わせて続けます。" + (KB.as_of ? "（" + ymd(KB.as_of) + "時点の情報）" : "") }));
    root.appendChild(audienceSwitch());
    var input = el("input", { class: "search", type: "search", placeholder: "🔍 さがす（例：税金、送金、怪しい、利息）", "aria-label": "説明カードをさがす" });
    input.value = explainState.query;
    var chips = el("div", { class: "chips", role: "group", "aria-label": "分類で絞り込む" });
    var list = el("div");
    function matches(c) {
      if (explainState.cat !== "all" && c.cat !== explainState.cat) return false;
      var q = norm(explainState.query).trim();
      if (!q) return true;
      var hay = norm([c.q, c.one, c.easy, c.pro, (c.ask || []).join(" ")].join(" "));
      return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
    }
    function draw() {
      chips.innerHTML = "";
      [{ id: "all", label: "すべて" }].concat(KB.categories || []).forEach(function (cat) {
        chips.appendChild(el("button", { class: "chip", type: "button", "aria-pressed": String(explainState.cat === cat.id), onclick: function () {
          explainState.cat = cat.id; store("kaia.explainCat", cat.id); draw();
        } }, [cat.label]));
      });
      list.innerHTML = "";
      var shown = (KB.cards || []).filter(matches);
      if (!shown.length) {
        list.appendChild(el("div", { class: "card empty" }, [el("div", { class: "big", text: "🤔" }), "見つかりませんでした。", el("br"), "ここに無い質問は、Claudeに聞いてください。集めた資料から調べて答えます。"]));
        return;
      }
      shown.forEach(function (c) { list.appendChild(qaCard(c)); });
      list.appendChild(el("p", { class: "small muted", style: "text-align:center;margin-top:16px", text: "ここに無い質問は、Claudeに相談してください。答えが決まったら、このページにも足します。" }));
    }
    input.addEventListener("input", function () { explainState.query = input.value; draw(); });
    root.appendChild(input);
    root.appendChild(chips);
    root.appendChild(list);
    draw();
  }

  // ---------- 📋 データ ----------
  function sparkline(values) {
    var w = 300, h = 56, pad = 4;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = max - min || 1;
    var pts = values.map(function (v, i) { return [(i / (values.length - 1)) * w, h - pad - ((v - min) / span) * (h - pad * 2)]; });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("class", "spark");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "直近30日の推移");
    var area = document.createElementNS(svg.namespaceURI, "path");
    area.setAttribute("class", "area");
    area.setAttribute("d", line + " L" + w + " " + h + " L0 " + h + " Z");
    var path = document.createElementNS(svg.namespaceURI, "path");
    path.setAttribute("class", "line");
    path.setAttribute("d", line);
    svg.appendChild(area);
    svg.appendChild(path);
    return svg;
  }
  function liveNumbers() {
    var n = (DATA && DATA.numbers) || {};
    if (!n.stable_usd && !n.tvl && !n.jpy) return null;
    var cards = el("div", { class: "stats" });
    if (n.jpy) {
      cards.appendChild(el("div", { class: "stat" }, [
        el("div", { class: "label", text: "Kaia上の日本円ステーブルコイン（JPYCなど）" }),

    ])]);
  }
  var tlCat = "all";
  function renderData() {
    var root = document.getElementById("data");

    root.appendChild(el("p", { class: "howto", text: "詳しい人に聞かれたときの「数字・日付・出典」の一覧です。" + (KB.as_of ? ymd(KB.as_of) + "時点で確認した内容です。" : "") }));

        (g.src || []).length ? el("div", { class: "small muted", style: "margin-top:8px" }, ["出典："].concat((g.src || []).map(function (s, i) {
          return el("span", null, [i ? "／" : "", el("a", { href: s.u, target: "_blank", rel: "noopener", text: s.t })]);
        }))) : null

    // 年表

    function drawTl() {
      chips.innerHTML = "";

          el("span", { class: "d", text: ymd(t.d) }),
          el("span", { class: "t" }, [el("span", { class: "dotc", style: "background:" + (CAT_COLORS[t.cat] || "var(--ink-3)") }), t.u ? el("a", { href: t.u, target: "_blank", rel: "noopener", text: t.t }) : t.t])
        ]));

    // 公式の入口

  // ---------- 🗞 ニュース ----------
  var newsFilter = store("kaia.newsFilter") || "all";
  function renderNews() {
    var root = document.getElementById("news");
    root.innerHTML = "";
    if (!DATA) { root.appendChild(el("div", { class: "notice warn", text: "ニュースのデータを読み込めませんでした。少し時間をおいて開き直してください。" })); return; }

    var listBox = el("div");
    var filters = [["all", "すべて"], ["unifi", "Unifi"], ["both", "Kaia × JPYC"], ["kaia", "Kaia"], ["jpyc", "JPYC"], ["stablecoin", "円ステーブルコイン"]];
    function draw() {
      chips.innerHTML = "";
      filters.forEach(function (f) {
        var n = f[0] === "all" ? list.length : list.filter(function (x) { return x.topic === f[0]; }).length;
        if (f[0] !== "all" && !n) return;
        chips.appendChild(el("button", { class: "chip", type: "button", "aria-pressed": String(newsFilter === f[0]), onclick: function () { newsFilter = f[0]; store("kaia.newsFilter", newsFilter); draw(); } }, [f[1] + " " + n]));
      });
      listBox.innerHTML = "";
      var shown = list.filter(function (x) { return newsFilter === "all" || x.topic === newsFilter; });
      if (!shown.length) { listBox.appendChild(el("div", { class: "empty", text: "この区分の話題はまだありません" })); return; }
      var lastDay = "";
      shown.forEach(function (n) {
        var day = mdw(n.date);
        if (day !== lastDay) { listBox.appendChild(el("div", { class: "day", text: day })); lastDay = day; }
        var flags = [];
        if (n.negative) flags.push(el("span", { class: "flag bad", text: "注意" }));
        if (n.price_talk) flags.push(el("span", { class: "flag warn", text: "値動きの話" }));
        if (n.digested) flags.push(el("span", { class: "flag done", text: "✓ まとめ済み" }));
        var others = (n.others || []).length ? el("details", { class: "others" }, [
          el("summary", { text: "ほかの報道 " + n.others.length + "件" }),
          el("div", null, n.others.map(function (o) { return el("a", { href: o.url, target: "_blank", rel: "noopener", text: "・" + o.source }); }))
        ]) : null;
        listBox.appendChild(el("article", { class: "news" }, [
          el("a", { class: "title", href: n.url, target: "_blank", rel: "noopener", text: n.title }),
          n.original_title ? el("div", { class: "orig", text: n.original_title }) : null,
          el("div", { class: "meta" }, [topicTag(n.topic), el("span", { text: n.source + "｜" + n.label })].concat(flags).concat([el("span", { text: ago(n.date) })])),
          relButtons((n.title || "") + " " + (n.original_title || "")),
          others
        ]));
      });
    }
    root.appendChild(el("p", { class: "small muted", style: "margin:0 0 10px", text: "直近1週間のUnifi・Kaia・JPYC・円ステーブルコインの話題。同じ出来事は1件にまとめています。値動きの話は発信には使わないでください。" }));
    root.appendChild(chips);
    root.appendChild(listBox);
    draw();
  }

  // ---------- 📖 用語 ----------
  var wordState = { cat: "all", query: "" };
  function renderWords() {
    var root = document.getElementById("words");
    root.innerHTML = "";
    if (!KB) return;
    var terms = KB.glossary || [];
    root.appendChild(el("p", { class: "howto", text: "よく出てくる言葉を、中学生にも分かる言葉で。「慣れている人向け」にすると補足も出ます。" }));
    root.appendChild(audienceSwitch());
    var input = el("input", { class: "search", type: "search", placeholder: "🔍 言葉をさがす", "aria-label": "用語をさがす" });
    input.value = wordState.query;
    var chips = el("div", { class: "chips" });
    var list = el("div");
    var cats = [["all", "すべて"], ["unifi", "📱 Unifi・LINE"], ["jpyc", "💴 JPYC"], ["kaia", "🟢 Kaia"], ["basic", "🔤 基本"], ["law", "🏛 制度"]];
    function draw() {
      chips.innerHTML = "";
      cats.forEach(function (c) { chips.appendChild(el("button", { class: "chip", type: "button", "aria-pressed": String(wordState.cat === c[0]), onclick: function () { wordState.cat = c[0]; draw(); } }, [c[1]])); });
      list.innerHTML = "";
      var q = norm(wordState.query).trim();
      terms.filter(function (t) {
        return (wordState.cat === "all" || t.cat === wordState.cat) && (!q || norm(t.term + " " + t.desc + " " + t.pro).indexOf(q) >= 0);
      }).forEach(function (t) {
        list.appendChild(el("div", { class: "term" }, [
          el("div", { class: "n", text: t.term }),
          el("div", { class: "d", text: t.desc }),
          audience === "pro" && t.pro ? el("div", { class: "p", text: "⚡ " + t.pro }) : null
        ]));
      });
      if (!list.childNodes.length) list.appendChild(el("div", { class: "empty", text: "見つかりませんでした" }));
    }
    input.addEventListener("input", function () { wordState.query = input.value; draw(); });
    root.appendChild(input);
    root.appendChild(chips);
    root.appendChild(list);
    draw();
  }

  // ---------- 🛡 心得 ----------
  function renderManner() {
    var root = document.getElementById("manner");
    root.innerHTML = "";
    if (!KB) return;
    var e = KB.etiquette || {};
    root.appendChild(el("div", { class: "card daily" }, [el("div", { class: "k", text: "アンバサダーとしての基本姿勢" }), el("div", { class: "q", text: e.stance || "" })]));
    root.appendChild(el("div", { class: "dodont" }, [
      el("div", { class: "card ok" }, [el("h3", { text: "✅ すること" }), el("ul", null, (e.do || []).map(function (x) { return el("li", { text: x }); }))]),
      el("div", { class: "card ng" }, [el("h3", { text: "🚫 しないこと" }), el("ul", null, (e.dont || []).map(function (x) { return el("li", { text: x }); }))])
    ]));
    if (e.disclosure) root.appendChild(el("div", { class: "card" }, [el("h2", { text: "🏷 PR表記（ステマ規制）" }), el("p", { style: "margin:0", text: e.disclosure })]));
    if (e.answer_pattern) root.appendChild(el("div", { class: "card" }, [el("h2", { text: "🗣 答え方の型" }), el("ol", { class: "pattern" }, e.answer_pattern.map(function (x) { return el("li", { text: x }); })), el("p", { class: "small muted", style: "margin:8px 0 0", text: "「💬 説明」タブのカードはこの型で書いてあります。" })]));
    root.appendChild(el("div", { class: "sec-title", text: "✍️ そのまま使える文章" }));
    (KB.templates || []).forEach(function (t) {
      root.appendChild(el("div", { class: "card tpl" }, [
        el("div", { class: "box-head" }, [el("h3", { text: t.title }), el("span", { class: "count", text: t.text.length + "字" })]),
        el("pre", { class: "text", text: t.text }),
        t.note ? el("p", { class: "small muted", style: "margin:6px 0 0", text: "メモ：" + t.note }) : null,
        el("div", { class: "actions" }, [copyBtn("📋 コピー", t.text)])
      ]));
    });
  }

  // ---------- ✅ 準備 ----------
  var TODOS = [
    ["rules", "アンバサダーの規約を確認する", "付けるハッシュタグ・PR表記・使ってよいロゴや画像。デスクトップの「Kaiaアンバサダー資料」フォルダに入れてもらえれば、文章やこのページに反映します"],
    ["try", "Unifiを自分で一通り使ってみる", "始める → JPYCを少し入れる → 送る → 円に戻す。自分の体験がいちばん伝わる説明になります（できる範囲で）"],
    ["practice", "「今日おぼえる1枚」を声に出して練習する", "ひとことで言えるようになれば、はじめての人との会話がぐっと楽になります"],
    ["community", "発信する場所を決める", "LINEオープンチャット・Discord・Xなど。決まったら、その場所に合う長さの文章に整えます"],
    ["profile", "Xのプロフィールを整える", "「🛡 心得」タブに例があります"],
    ["launch", "発信を始める日を決める", "準備期間が終わったら、このページの「準備期間」表示を外します"]
  ];
  function renderStatus() {
    var root = document.getElementById("status");
    root.innerHTML = "";
    var s = (DATA && DATA.status) || {};
    var src = (s.sources && s.sources.sources) || [];
    var okCount = src.filter(function (x) { return x.ok; }).length;
    function check(state, what, how, extra) {
      var mark = { ok: "✓", wait: "!", ng: "×", off: "–" }[state];
      return el("div", { class: "check" }, [el("span", { class: "dot " + state, text: mark }), el("div", { style: "flex:1;min-width:0" }, [el("div", { class: "what", text: what }), el("div", { class: "how", text: how }), extra || null])]);
    }
    var aiState = s.ai === "off" ? ["ok", "費用: 無料で運用中", "AIは使わない設定です。ニュースは見出し・記事の一部・出典リンクでまとめます"]
      : s.ai === "ok" ? ["wait", "AI要約: 動いています（有料）", "Claude APIの利用料がかかります"]
      : ["ok", "費用: 無料で運用中", "AIは使っていません"];
    var srcList = el("ul", { class: "src-list" }, src.map(function (x) {
      return el("li", null, [el("span", { text: x.ok ? "✅" : "⚠️" }), el("span", { text: x.name }), el("span", { class: "n", text: x.ok ? "新着 " + x.added : "取得できず" })]);
    }));
    var generalNote = s.sources && s.sources.general_total ? el("div", { class: "how", text: "ほかに一般のニュース媒体 " + s.sources.general_ok + "/" + s.sources.general_total + " も見ています" }) : null;
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: "仕組みの状態" }),
      DATA ? check(src.length && okCount === src.length ? "ok" : (okCount ? "wait" : "ng"), "情報源: " + okCount + "/" + src.length + " 取得できています",
        s.sources && s.sources.checked_at ? "最後に見に行った時刻 " + mdw(s.sources.checked_at) + " " + hm(parseDate(s.sources.checked_at)) : "",
        el("div", null, [srcList, generalNote])) : check("ng", "ニュースのデータを読み込めませんでした", "少し時間をおいて開き直してください"),
      check(aiState[0], aiState[1], aiState[2]),
      check("ok", "Webページ: 自動で更新中", "まとめは毎朝" + (s.digest_hour || 7) + "時、ニュース一覧は" + (s.refresh_hours || 3) + "時間おき。説明カード・データは手で更新（" + (KB && KB.as_of ? ymd(KB.as_of) : "") + "時点）"),
      check(s.discord ? "ok" : "off", "Discordへの通知: " + (s.discord ? "設定済み" : "使っていません（任意）"), "このページだけで使えます")
    ]));
    var todoCard = el("div", { class: "card" }, [el("h2", { text: "準備期間のやることリスト" }), el("p", { class: "small muted", style: "margin:0 0 4px", text: "チェックはこの端末に保存されます" })]);
    TODOS.forEach(function (t) {
      var key = "kaia.todo." + t[0];
      var box = el("input", { type: "checkbox", "aria-label": t[1] });
      box.checked = store(key) === "1";
      var row = el("label", { class: "todo" + (box.checked ? " checked" : "") }, [box, el("div", null, [el("div", { class: "what", text: t[1] }), el("div", { class: "how", text: t[2] })])]);
      box.addEventListener("change", function () { store(key, box.checked ? "1" : "0"); row.classList.toggle("checked", box.checked); });
      todoCard.appendChild(row);
    });
    root.appendChild(todoCard);
    root.appendChild(el("div", { class: "card" }, [
      el("h2", { text: "💡 分からないことがあったら" }),
      el("p", { style: "margin:0", text: "Claudeに聞いてください。Unifi・JPYC・Kaiaについて集めた資料（公式発表・日付・出典つき）から答えます。答えが決まった質問は、このページの「説明」にも足していきます。" })
    ]));
  }

  // ---------- 起動 ----------
  var RENDER = { today: function () { renderToday(document.getElementById("today")); }, explain: renderExplain, data: renderData, news: renderNews, words: renderWords, manner: renderManner, status: renderStatus };
  function renderAll() {
    Object.keys(RENDER).forEach(function (k) {
      try { RENDER[k](); }
      catch (e) { var r = document.getElementById(k); r.innerHTML = ""; r.appendChild(el("div", { class: "notice bad", text: "この部分を表示できませんでした" })); }
    });
  }
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  function show(name) {
    if (!RENDER[name]) name = "today";
    tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.tab === name)); });
    Object.keys(RENDER).forEach(function (k) { document.getElementById(k).hidden = k !== name; });
    store("kaia.tab", name);
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.dataset.tab); window.scrollTo(0, 0); }); });

  function getJson(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(null, function () { return null; });
  }
  Promise.all([getJson(DATA_URL + "?t=" + Math.floor(Date.now() / 60000)), getJson(KB_URL + "?t=" + Math.floor(Date.now() / 600000))]).then(function (res) {
    DATA = res[0];
    KB = res[1];
    document.getElementById("loading").remove();
    if (!DATA && !KB) {
      var main = document.querySelector("main");
      main.insertBefore(el("div", { class: "loading", text: "データを読み込めませんでした。少し時間をおいて開き直してください。" }), main.firstChild);
      return;
    }
    if (!DATA || DATA.prep_mode) document.getElementById("prepBadge").hidden = false;
    var up = DATA && parseDate(DATA.updated_at);
    if (up) document.getElementById("updated").append("ニュース更新 " + mdw(DATA.updated_at) + " " + hm(up), el("br"), ago(DATA.updated_at));
    prepareCards();
    renderAll();
    var start = (location.hash || "").slice(1) || store("kaia.tab") || "today";
    if (start === "history") start = "today";
    if (start === "numbers" || start === "topics") start = "data";
    show(start);
  });
})();
