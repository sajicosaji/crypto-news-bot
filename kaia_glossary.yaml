# 初心者向けまとめの「📖 今日のことば」に使う辞書（kaia_daily が使う）
#
# その日のまとめに出てきた言葉だけを、出てきた順に最大6つ載せる。
# match は正規表現（大文字・小文字は区別しない）。desc は中学生にも分かる言葉で、事実だけを書く。
# 説明を足すときは、公式の資料（Kaiaのドキュメント・各社のプレスリリース）で確かめた内容にすること。

terms:
  - term: "Kaia（カイア）"
    match: '\bKaia\b|カイア'
    desc: "KakaoのKlaytnとLINEのFinschiaが一つになって生まれたブロックチェーン。アジアで広く使われることを目指している。"
  - term: "KAIA"
    match: '\bKAIA\b(?!\s*DLT)'
    desc: "Kaiaブロックチェーンで使われる暗号資産。取引の手数料の支払いなどに使われる。"
  - term: "JPYC"
    match: 'JPYC'
    desc: "日本円と1対1で交換できる、日本円建てのステーブルコイン。Kaiaを含む複数のブロックチェーンで発行されている。"
  - term: "ステーブルコイン"
    match: 'ステーブルコイン|ステ-ブルコイン|ステ－ブルコイン|stablecoin'
    desc: "円やドルと同じ値動きをするように作られた、デジタルのお金。値段が大きく上下しにくい。"
  - term: "暗号資産（仮想通貨）"
    match: '暗号資産|仮想通貨'
    desc: "インターネット上でやり取りできるデジタルな資産。ビットコインなど。"
  - term: "ブロックチェーン"
    match: 'ブロックチェーン|blockchain'
    desc: "取引の記録をみんなで共有して、あとから書き換えにくくする仕組み。"
  - term: "LINE NEXT"
    match: 'LINE NEXT'
    desc: "LINE系の会社で、ブロックチェーンを使ったサービスを手がけている。ウォレット「Unifi」などを提供。"
  - term: "Unifi"
    match: 'Unifi'
    desc: "LINE NEXTが提供するデジタルウォレット（ステーブルコインなどを入れておくアプリ）。"
  - term: "ウォレット"
    match: 'ウォレット|wallet'
    desc: "暗号資産を入れておく「お財布」のようなアプリ。"
  - term: "Mini Dapp"
    match: 'Mini ?Dapp|ミニDapp'
    desc: "LINEの中で動く、ブロックチェーンを使ったミニアプリ。"
  - term: "覚書（MOU）"
    match: '覚書|\bMOU\b'
    desc: "正式な契約の前に「この方向で一緒に進めましょう」と確認し合う書面。"
  - term: "業務提携"
    match: '業務提携|提携'
    desc: "会社どうしが、それぞれの得意分野を持ち寄って協力すること。"
  - term: "PoC（実証実験）"
    match: '\bPoC\b|概念実証|実証実験|実証'
    desc: "新しいアイデアや技術が、実際に使えるかどうかを試してみる取り組み。"
  - term: "ガバナンス"
    match: 'ガバナンス|Governance'
    desc: "ブロックチェーンのルールやお金の使い道を、関係者の話し合いや投票で決める仕組み。"
  - term: "GC（ガバナンス・カウンシル）"
    match: '\bGC\b|ガバナンス・カウンシル|Governance Council'
    desc: "Kaiaのルールを決める投票に参加する、企業などの集まり。"
  - term: "ステーキング"
    match: 'ステーキング|[Ss]taking'
    desc: "暗号資産を預けてネットワークの運営を支え、その見返りに報酬を受け取る仕組み。"
  - term: "貢献報酬（CR）"
    match: '貢献報酬|Contribution Reward|\bCR\b'
    desc: "Kaiaネットワークに貢献した人に、追加のKAIAを配るプログラム。"
  - term: "DeFi（ディーファイ）"
    match: '\bDeFi\b|ディーファイ|分散型金融'
    desc: "銀行などを通さずに、ブロックチェーン上でお金の貸し借りや交換ができるサービス。"
  - term: "TVL"
    match: '\bTVL\b'
    desc: "DeFiのサービスに預けられている資産の合計額。どれだけ使われているかの目安になる。"
  - term: "トークン化"
    match: 'トークン化|tokeniz'
    desc: "株や債券、不動産などの資産を、ブロックチェーン上で扱えるデジタルの形にすること。"
  - term: "RWA"
    match: '\bRWA\b'
    desc: "現実世界の資産（Real World Asset）のこと。不動産や債券などをブロックチェーン上で扱う取り組みを指すことが多い。"
  - term: "MMF"
    match: '\bMMF\b'
    desc: "短い期間の債券などで運用し、元本の安定を重視する投資信託の一種。"
  - term: "資金移動業"
    match: '資金移動業'
    desc: "銀行以外の会社が送金サービスを行うための、国への登録制度。JPYCはこの登録を受けて発行されている。"
  - term: "電子決済手段"
    match: '電子決済手段'
    desc: "日本の法律で、ステーブルコインを指すことば。"
  - term: "償還"
    match: '償還'
    desc: "持っているステーブルコインを、元の日本円などに戻すこと。"
  - term: "チャージ"
    match: 'チャージ'
    desc: "ウォレットなどにお金を入れること。"
  - term: "上場"
    match: '上場|listing|상장'
    desc: "取引所で売り買いできるようになること。"
  - term: "Upbit（アップビット）"
    match: 'Upbit|アップビット|업비트'
    desc: "韓国の大手の暗号資産取引所。"
  - term: "Bithumb（ビッサム）"
    match: 'Bithumb|ビッサム|빗썸'
    desc: "韓国の大手の暗号資産取引所。"
  - term: "ガス代"
    match: 'ガス代'
    desc: "ブロックチェーンで取引をするときにかかる手数料。"
  - term: "Web3"
    match: 'Web3'
    desc: "ブロックチェーンを使った、新しいインターネットのサービスの総称。"
  - term: "USDC・USDT"
    match: '\bUSDC\b|\bUSDT\b'
    desc: "米ドルと同じ値動きをするステーブルコインの代表例。"
